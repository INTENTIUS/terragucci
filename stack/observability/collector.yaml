# The collector the observability profile runs. Stages send OTLP over HTTP to
# otel-collector:4318. Traces are written as OTLP/JSON lines to
# /out/traces.jsonl, which the smoke claims read with `docker cp`; metrics
# are served to Prometheus on :8889, with resource attributes (the commit
# among them) copied onto every series so a claim can find its own run.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  file/traces:
    path: /out/traces.jsonl
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces]
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
