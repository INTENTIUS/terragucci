          description: Wave applies succeed. The error ratio over both the last 1d and the last 2h is above 0.028 (2.8 times the 0.01 budget of a 0.99 objective). At that rate the 28d error budget is gone in 1w3d.
      - alert: ErrorBudgetBurn
        expr: |-
