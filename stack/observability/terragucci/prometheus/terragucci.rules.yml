        labels:
          slo: terragucci-apply-success
      - record: slo:sli_error:ratio_rate6h
        expr: |-
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result="failed"}[6h])))
          /
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result=~"applied|failed"}[6h])))
        labels:
          slo: terragucci-apply-success
      - record: slo:sli_error:ratio_rate1d
        expr: |-
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result="failed"}[1d])))
          /
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result=~"applied|failed"}[1d])))
        labels:
          slo: terragucci-apply-success
      - record: slo:sli_error:ratio_rate3d
        expr: |-
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result="failed"}[3d])))
          /
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result=~"applied|failed"}[3d])))
        labels:
          slo: terragucci-apply-success
      - record: slo:sli_error:ratio_rate28d
        expr: avg_over_time(slo:sli_error:ratio_rate5m{slo="terragucci-apply-success"}[28d])
        labels:
          slo: terragucci-apply-success
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels:
          slo: terragucci-apply-success
      - record: slo:error_budget:remaining
        expr: 1 - (slo:sli_error:ratio_rate28d{slo="terragucci-apply-success"} / 0.01)
        labels:
          slo: terragucci-apply-success
      - alert: ErrorBudgetBurn
        expr: |-
          (
            slo:sli_error:ratio_rate1h{slo="terragucci-apply-success"} > (13.44 * 0.01)
          )
          and
          (
            slo:sli_error:ratio_rate5m{slo="terragucci-apply-success"} > (13.44 * 0.01)
          )
        labels:
          slo: terragucci-apply-success
          severity: page
          long_window: 1h
          short_window: 5m
        annotations:
          summary: SLO terragucci-apply-success is burning its error budget more than 13.44x too fast (1h and 5m windows)
          description: Wave applies succeed. The error ratio over both the last 1h and the last 5m is above 0.1344 (13.44 times the 0.01 budget of a 0.99 objective). At that rate the 28d error budget is gone in 2d2h.
      - alert: ErrorBudgetBurn
        expr: |-
          (
            slo:sli_error:ratio_rate6h{slo="terragucci-apply-success"} > (5.6 * 0.01)
          )
          and
          (
            slo:sli_error:ratio_rate30m{slo="terragucci-apply-success"} > (5.6 * 0.01)
          )
        labels:
