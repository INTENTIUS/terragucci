# Generated by terragucci from terragucci.yml (dashboards). Edit terragucci.yml, then run terragucci init.
groups:
  - name: slo-terragucci-apply-success
    rules:
      - record: slo:sli_error:ratio_rate5m
        expr: |-
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result="failed"}[5m])))
          /
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result=~"applied|failed"}[5m])))
        labels:
          slo: terragucci-apply-success
      - record: slo:sli_error:ratio_rate30m
        expr: |-
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result="failed"}[30m])))
          /
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result=~"applied|failed"}[30m])))
        labels:
          slo: terragucci-apply-success
      - record: slo:sli_error:ratio_rate1h
        expr: |-
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result="failed"}[1h])))
          /
          (sum by (terragucci_project) (rate(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result=~"applied|failed"}[1h])))
        labels:
          slo: terragucci-apply-success
      - record: slo:sli_error:ratio_rate2h
