  - name: terragucci
    rules:
      - alert: TerragucciDriftOld
        expr: |-
          time() - ((
          (max by (project) (last_over_time(terragucci_drift_since_seconds[7d]))) unless on (project) (max by (project) (last_over_time(terragucci_drift_clear_seconds[7d])))
          )
          or
          (
          (max by (project) (last_over_time(terragucci_drift_since_seconds[7d]))) > on (project) (max by (project) (last_over_time(terragucci_drift_clear_seconds[7d])))
          )) > 86400
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.project }} has drift older than 1d"
          description: Its drift issue names the roots. Correct the drift with a pull request, or apply the code as it is.
      - alert: TerragucciWaveWaiting
        expr: |-
          time() - ((
          (max by (project, wave) (last_over_time(terragucci_wave_waiting_since_seconds[7d]))) unless on (project, wave) (max by (project, wave) (last_over_time(terragucci_wave_settled_seconds[7d])))
          )
          or
          (
          (max by (project, wave) (last_over_time(terragucci_wave_waiting_since_seconds[7d]))) > on (project, wave) (max by (project, wave) (last_over_time(terragucci_wave_settled_seconds[7d])))
          )) > 14400
        labels:
          severity: ticket
        annotations:
          summary: wave {{ $labels.wave }} of {{ $labels.project }} has waited for an approval longer than 4h
          description: Its apply job printed the chant approve command for its digest.
      - alert: TerragucciApplyFailed
        expr: sum by (terragucci_project) (increase(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result="failed"}[1h])) > 0
        labels:
          severity: page
        annotations:
          summary: an apply of {{ $labels.terragucci_project }} failed in the last hour
          description: The apply job's log and the triage response name the error.
      - alert: TerragucciWaveRefused
        expr: sum by (terragucci_project) (increase(terragucci_spans_calls_total{terragucci_stage="tf-apply", terragucci_result="refused"}[1h])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "a wave of {{ $labels.terragucci_project }} was refused: its plans moved after approval"
          description: The wave applied nothing. Read what moved, then approve the new digest.
      - alert: TerragucciDriftStopped
        expr: time() - max by (project) (last_over_time(terragucci_last_run_seconds{stage="tf-drift"}[30d])) > 172800
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.project }}'s drift run has not run for 2d"
          description: Its schedule stopped, or every run failed before it could report.
