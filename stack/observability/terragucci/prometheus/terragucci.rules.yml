          description: Wave applies succeed. The error ratio over both the last 6h and the last 30m is above 0.056 (5.6 times the 0.01 budget of a 0.99 objective). At that rate the 28d error budget is gone in 5d.
      - alert: ErrorBudgetBurn
        expr: |-
          (
            slo:sli_error:ratio_rate1d{slo="terragucci-apply-success"} > (2.8 * 0.01)
