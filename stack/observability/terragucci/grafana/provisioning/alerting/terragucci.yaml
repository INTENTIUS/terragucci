# Generated by terragucci from terragucci.yml (dashboards). Edit terragucci.yml, then run terragucci init.
# Grafana alerting provisioning, generated by chant.
apiVersion: 1
groups:
  - name: slo-terragucci-apply-success-grafana
    folder: terragucci
    interval: 1m
    rules:
      - uid: slo-terragucci-apply-success-1h-5m
        title: SLO terragucci-apply-success error budget burn 1h/5m (page)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              refId: A
              expr: slo:sli_error:ratio_rate1h{slo="terragucci-apply-success"}
              instant: true
              range: false
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              refId: B
              expr: slo:sli_error:ratio_rate5m{slo="terragucci-apply-success"}
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              refId: C
              type: math
              expression: $A > 0.1344 && $B > 0.1344
        noDataState: OK
        execErrState: Error
        annotations:
          summary: SLO terragucci-apply-success is burning its error budget more than 13.44x too fast (1h and 5m windows)
          description: The error ratio over both the last 1h and the last 5m is above 0.1344 (13.44 times the 0.01 budget of a 0.99 objective). At that rate the 28d error budget is gone in 2d2h.
