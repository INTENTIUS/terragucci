# tg-template-upgrade (terragucci#1312): two apps on acme/bucket/aws 1.2.0,
# with orders the canary. 1.3.0 is signed in the fixture registry and 1.4.0 is
# not, so under templates.require: signed 1.3.0 is the upgrade.
forge: forgejo
binary: tofu
url: http://forgejo:3000/terragucci-admin/hs-tg-template-upgrade
token_env: TERRAGUCCI_FORGEJO_TOKEN
roots: ["apps/*"]
gate: never
env:
  # The fixture registry's host, served by this repo's own files on Forgejo
  # (registry/tofurc, from stack/harness/fixtures/templates).
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/registry/tofurc
modules:
  registry:
    dir: registry
    url: https://modules.harness.local
    namespace: acme
    system: aws
templates:
  apps: apps/{name}
  require: signed
generate:
  backend:
    s3:
      bucket: hs-tg-template-upgrade-state
      key: "{root}/terraform.tfstate"
      region: us-east-1
      use_path_style: true
  providers:
    aws:
      source: hashicorp/aws
      version: ">= 5.0"
      region: us-east-1
      s3_use_path_style: true
      skip_credentials_validation: true
      skip_metadata_api_check: true
      skip_requesting_account_id: true
