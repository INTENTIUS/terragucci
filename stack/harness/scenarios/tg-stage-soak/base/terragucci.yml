# tg-stage-soak (terragucci#1493): dev and prod, one root each, on floci. dev's
# soak runs a command that passes once the repo holds soak-ok, so a promote of
# a release from dev into prod waits while it fails. Both gates are never: only
# the soak holds the promote.
forge: forgejo
binary: tofu
url: http://forgejo:3000/terragucci-admin/hs-tg-stage-soak
token_env: TERRAGUCCI_FORGEJO_TOKEN
roots: ["envs/*/net"]
apply:
  branches:
    release: ["envs/prod/**"]
environments:
  dev:
    roots: ["envs/dev/**"]
    gate: never
    soak:
      duration: "0"
      checks:
        - kind: command
          command: ["sh", "-c", "test -f soak-ok"]
  prod: { roots: ["envs/prod/**"], gate: never }
promotion: [dev, prod]
