# tg-template-app (terragucci#1308): a repo whose apps come from templates in
# the fixture registry (stack/harness/fixtures/templates, copied in by seed.sh).
# billing is an app made from acme/bucket/aws 1.2.0; the scenario requests a
# second one, orders, and follows its pull request to the apply.
forge: forgejo
binary: tofu
url: http://forgejo:3000/terragucci-admin/hs-tg-template-app
token_env: TERRAGUCCI_FORGEJO_TOKEN
roots: ["apps/*"]
gate: never
env:
  # The fixture registry's host, served by this repo's own files on Forgejo
  # (registry/tofurc, from stack/harness/fixtures/templates).
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/registry/tofurc
modules:
  registry:
    dir: registry
    url: https://modules.harness.local
    namespace: acme
    system: aws
templates:
  apps: apps/{name}
  require: signed
generate:
  backend:
    s3:
      bucket: hs-tg-template-app-state
      key: "{root}/terraform.tfstate"
      region: us-east-1
      use_path_style: true
  providers:
    aws:
      source: hashicorp/aws
      version: ">= 5.0"
      region: us-east-1
      s3_use_path_style: true
      skip_credentials_validation: true
      skip_metadata_api_check: true
      skip_requesting_account_id: true
