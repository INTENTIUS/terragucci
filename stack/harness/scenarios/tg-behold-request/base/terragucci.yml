# tg-behold-request (behold#1035): the repo tg-template-app plays on, with the
# app requested from behold's Templates form, which dispatches the request
# workflow.
forge: forgejo
binary: tofu
url: http://forgejo:3000/terragucci-admin/hs-tg-behold-request
token_env: TERRAGUCCI_FORGEJO_TOKEN
roots: ["apps/*"]
gate: never
env:
  # The fixture registry's host, served by this repo's own files on Forgejo
  # (registry/tofurc, from stack/harness/fixtures/templates).
  TF_CLI_CONFIG_FILE: ${{ github.workspace }}/registry/tofurc
modules:
  registry:
    dir: registry
    url: https://modules.harness.local
    namespace: acme
    system: aws
templates:
  apps: apps/{name}
  require: signed
generate:
  backend:
    s3:
      bucket: hs-tg-behold-request-state
      key: "{root}/terraform.tfstate"
      region: us-east-1
      use_path_style: true
  providers:
    aws:
      source: hashicorp/aws
      version: ">= 5.0"
      region: us-east-1
      s3_use_path_style: true
      skip_credentials_validation: true
      skip_metadata_api_check: true
      skip_requesting_account_id: true
