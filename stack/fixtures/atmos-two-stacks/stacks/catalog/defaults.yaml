terraform:
  backend_type: s3
  backend:
    s3:
      bucket: "@BUCKET@"
      key: terraform.tfstate
      region: us-east-1
      use_path_style: true
      use_lockfile: true

components:
  terraform:
    vpc:
      vars:
        cidr: 10.0.0.0/16
    app:
      dependencies:
        components:
          - component: vpc
      vars:
        replicas: 1
