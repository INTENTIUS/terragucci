          }' -- "$@"; }
          export TG_DOWNLOAD_DIR="$PWD/.terragrunt-cache/sources" TG_PROVIDER_CACHE_DIR="$PWD/.terragrunt-cache/providers"
          if [ -n "${TG_BEFORE:-}" ] && [ "${TG_BEFORE#0000000}" = "$TG_BEFORE" ] && git fetch -q --depth=1 origin "$TG_BEFORE" 2>/dev/null; then
            changed="$(git diff --name-only "$TG_BEFORE" HEAD)"
          else
            changed=
          fi
          moved=""
          for dir in 'live/dev/email' 'live/dev/orders' 'live/dev/payments' 'live/dev/platform' 'live/dev/search' 'live/prod/email' 'live/prod/orders' 'live/prod/payments' 'live/prod/platform' 'live/prod/search' 'live/staging/email' 'live/staging/orders' 'live/staging/payments' 'live/staging/platform' 'live/staging/search'; do
            if [ -z "$changed" ] || printf '%s\n' "$changed" | grep "^$dir/" >/dev/null; then moved="${moved:+$moved,}$dir"; fi
          done
