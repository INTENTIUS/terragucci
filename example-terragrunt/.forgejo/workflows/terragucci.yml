          TG_OUTCOME="$outcome" terragucci stage tf-apply --wave 5 --layers 'live/dev/platform;live/dev/email,live/dev/orders,live/dev/payments,live/dev/search;live/prod/platform,live/staging/platform;live/prod/email,live/prod/orders,live/prod/payments,live/staging/email,live/staging/orders,live/staging/payments,live/staging/search;live/prod/search' --binary tofu --gate on-destroy --terragrunt --rest 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          case "$rc" in
            0) ;;
            3) tg status terragucci/apply pending "$(cat "$outcome")"; exit 3 ;;
            4) tg status terragucci/apply failure "$(cat "$outcome")"; terragucci respond wave-refused --wave "$(sed -n 's/^wave \([0-9]*\) .*/\1/p' "$outcome")" --approved terragucci-report/approved --current terragucci-report/current || true; exit 4 ;;
            *) tg status terragucci/apply failure "an apply failed"; terragucci respond apply-failed --log "$log" || true; exit 1 ;;
          esac
          tg status terragucci/apply success "every wave of units applied"
          echo "all units applied"
      - name: Keep the apply report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: terragucci-report-apply-wave-5
          path: terragucci-report/
          if-no-files-found: ignore
  tips:
    runs-on: docker
    container:
      image: ghcr.io/intentius/terragucci-terragrunt:0.4.2-tg1.1.6-tofu1.13.1@sha256:6dad7eb02a82ee16bf9cb1cc7a354ffe788864eca91f78f49558f4cc0882bad0
    needs: apply-wave-5
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: terragucci-tips-${{ github.repository }}
      cancel-in-progress: false
    env:
      TG_TOKEN: '${{ github.token }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open a pull request for each tip
        shell: bash
        run: |
          set -u
          export FORGEJO_TOKEN="$TG_TOKEN"
          terragucci respond tips --mode apply --binary tofu || true
