                const open = gl ? await call("GET", repo + "/merge_requests?state=opened&target_branch=" + a[1] + "&per_page=100") : await call("GET", repo + "/pulls?state=open&base=" + a[1] + "&per_page=100");
                for (const pr of open) {
                  const n = gl ? pr.iid : pr.number, note = await find(n);
                  if (!note || note.body.includes("<!-- terragucci:stale -->")) continue;
                  const hit = (note.body.match(/roots=(\S*) -->/)?.[1] ?? "").split(",").filter((r) => moved.includes(r));
                  if (!hit.length) continue;
                  const lines = note.body.split("\n");
                  lines.splice(1, 0, "> This plan is stale: " + a[1] + " moved under " + hit.join(", ") + ". Push to this pull request to plan again. <!-- terragucci:stale -->");
                  await edit(n, note.id, lines.join("\n"));
                }
              }
            }
          } catch (err) {
            console.log("terragucci: " + cmd + " failed: " + err.message);
            if (cmd === "oidc") process.exit(1);
          }' -- "$@"; }
          terragucci comment --layers 'live/dev/email,live/dev/orders,live/dev/payments,live/dev/platform,live/dev/search;live/prod/email,live/prod/orders,live/prod/payments,live/prod/platform,live/prod/search,live/staging/email,live/staging/orders,live/staging/payments,live/staging/platform,live/staging/search' --forge forgejo --out terragucci-comment.json || exit 1
          read -r TG_PR TG_SHA TG_BASE TG_ROOT <<EOF
          $(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8"));console.log(d.go?[d.pr,d.sha,d.base,d.root||"-"].join(" "):"")' terragucci-comment.json)
          EOF
          [ -n "$TG_PR" ] || exit 0
          [ "$TG_ROOT" = "-" ] && TG_ROOT=""
          export TG_PR TG_SHA TG_ROOT TG_BASE="origin/$TG_BASE"
          git fetch --quiet origin "refs/pull/$TG_PR/head" || { echo "terragucci: could not fetch the pull request head" >&2; exit 1; }
          if [ "$(git rev-parse FETCH_HEAD)" != "$TG_SHA" ]; then echo "terragucci: the pull request moved while the comment was read; its push plans it" >&2; exit 0; fi
          git checkout --quiet --detach "$TG_SHA"
          export TG_DOWNLOAD_DIR="$PWD/.terragrunt-cache/sources" TG_PROVIDER_CACHE_DIR="$PWD/.terragrunt-cache/providers"
          tg status terragucci/plan pending "planning"
          terragucci stage tf-plan --out terragucci-report --binary tofu --layers 'live/dev/email,live/dev/orders,live/dev/payments,live/dev/platform,live/dev/search;live/prod/email,live/prod/orders,live/prod/payments,live/prod/platform,live/prod/search,live/staging/email,live/staging/orders,live/staging/payments,live/staging/platform,live/staging/search' --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" ${TG_ROOT:+--root "$TG_ROOT"} --terragrunt
          rc=$?
          if [ ! -f terragucci-report/report.json ]; then
