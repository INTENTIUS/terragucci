# The terralith demo (stack/demo.sh, scenario terralith): a thin terralith as
# one stock root on s3 state, adopted into a choudoufu estate, then with
# team-b carved out into an estate of its own, by pull requests that carry
# terragucci migrations. Every root runs on choudoufu, the OpenTofu fork for AWS and
# Kubernetes that keeps ownership as tags on each resource.
forge: forgejo
binary: choudoufu
# The demo's job image: the tofu CI image with SQL Yodeler and choudoufu
# (stack/demo-yodel/Dockerfile).
image: terragucci-demo-tofu:local
gate: on-destructive
reports:
  bucket: s3://demo-reports
  endpoint: http://floci:4566
  prefix: demo
env:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  TERRAGUCCI_METRICS_PER_RUN: "true"
  # The thin terralith's migrations write a few resources each, so their
  # progress goes to the reports bucket every 2 s rather than 5, and the
  # driver's count (stack/demo.sh, migration_follow) has lines to show.
  TG_PROGRESS_SECONDS: "2"
  # choudoufu's record store addresses its bucket virtual-hosted
  # (<bucket>.<host>). demo-records forwards those requests to floci
  # path-style (stack/docker-compose.yml, profile demo).
  AWS_ENDPOINT_URL_S3: http://demo-records:4566
