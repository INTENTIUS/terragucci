# Generated by chant — do not edit directly. Regenerate with: chant ci workflow --token-secret CI_GREEN_TOKEN (in the workspace root)
name: chant-ci-green

# Tags each commit on the branch that passed its required phases ci/green/<sha>,
# and a green commit that later fails one ci/revoked/<sha>.
on:
  workflow_run:
    workflows:
      - "publish"
      - "terragucci"
    types:
      - completed
    branches:
      - "main"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# One tick at a time, and a tick in progress is never cancelled.
concurrency:
  group: chant-ci-green
  cancel-in-progress: false

permissions:
  contents: write
  checks: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: "main"
          fetch-depth: 0
          token: ${{ secrets.CI_GREEN_TOKEN || github.token }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Tag the commits that turned green, revoke the ones that turned red
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx --yes @intentius/chant@0.124.58 ci tick
