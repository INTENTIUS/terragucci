name: nightly

on:
  workflow_dispatch: {}
  schedule:
    - cron: '41 3 * * *'

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  gitlab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install just
        run: |
          curl -fsSL -o /tmp/just.tar.gz https://github.com/casey/just/releases/download/1.36.0/just-1.36.0-$(uname -m)-unknown-linux-musl.tar.gz
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo mv /tmp/just /usr/local/bin/just
          just --version
      - name: Install
        run: npm ci
      - name: Start the gitlab profile
        run: just stack-up gitlab
      - name: Run the gitlab claims
        run: just validate-forge gitlab
      - name: Stop the stack
        if: always()
        run: just stack-down
