# Generated by chant — do not edit directly. Regenerate with: chant release workflow --forge github (in the workspace root)
name: chant release
on:
  workflow_dispatch:
    inputs:
      label:
        description: The release's label, such as v1.4.0
        required: true
        type: string
permissions:
  contents: write
  id-token: write
  packages: write
concurrency:
  group: chant-release
  cancel-in-progress: false
env:
  CHANT_RELEASE_LABEL: ${{ inputs.label }}
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.green.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: git fetch origin 'refs/tags/ci/*:refs/tags/ci/*'
      - id: green
        run: |
          commit="$(npx chant ci last-green --from "$GITHUB_SHA" --json | node -e 'const f=process.argv[1];const t=f?require("fs").readFileSync(f,"utf8"):require("fs").readFileSync(0,"utf8");const d=JSON.parse(t);process.stdout.write(String(d.commit?.sha??""))')"
          if [ -z "$commit" ]; then echo "no green commit at or below $GITHUB_SHA, so no release is cut" >&2; exit 1; fi
          if ! git diff --quiet "$commit" "$GITHUB_SHA" -- ":(top).github/workflows"; then
            changed="$(git log -1 --format=%H "$commit..$GITHUB_SHA" -- ":(top).github/workflows")"
            echo "the newest green commit, $commit, has other workflow files than $GITHUB_SHA, and GitHub refuses this job's token a tag on it, so no release is cut. Dispatch again once ${changed:-$GITHUB_SHA}, which changed .github/workflows, or a commit after it is green." >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  cut:
    needs: gate
    runs-on: ubuntu-latest
    env:
      CHANT_RELEASE_COMMIT: ${{ needs.gate.outputs.commit }}
      OCI_USERNAME: "${{ github.actor }}"
      OCI_PASSWORD: "${{ github.token }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: "arm64"
      - run: "have=\"$(npm --version)\"; if [ \"$(printf '%s\\n' \"11.5.1\" \"$have\" | sort -V | head -n1)\" != \"11.5.1\" ]; then npm install -g npm@11.19.0; fi; npm --version"
      - run: git fetch origin 'refs/tags/ci/*:refs/tags/ci/*'
      - run: rc=0; git ls-remote --exit-code --heads origin chant/lifecycle >/dev/null || rc=$?; if [ "$rc" = 0 ]; then git fetch origin chant/lifecycle:chant/lifecycle; elif [ "$rc" != 2 ]; then exit "$rc"; fi
      - run: |
          git config user.name "chant release"
          git config user.email "chant-release@localhost"
          npx chant release cut "$CHANT_RELEASE_LABEL" --at "$CHANT_RELEASE_COMMIT" --yes --build 'node scripts/build-cli.mjs' --json > "$RUNNER_TEMP/chant-cut.json"
          tag="$(node -e 'const f=process.argv[1];const t=f?require("fs").readFileSync(f,"utf8"):require("fs").readFileSync(0,"utf8");const d=JSON.parse(t);process.stdout.write(String(d.tag?.name??""))' "$RUNNER_TEMP/chant-cut.json")"
          if [ -n "$tag" ]; then git push origin "refs/tags/$tag"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chant-release-images
          path: |
            dist/images/tofu.tar
            dist/images/terraform.tar
            dist/images/terragrunt.tar
            dist/images/choudoufu.tar
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [gate, cut]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OCI_USERNAME: "${{ github.actor }}"
      OCI_PASSWORD: "${{ github.token }}"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: "arm64"
      - run: "have=\"$(npm --version)\"; if [ \"$(printf '%s\\n' \"11.5.1\" \"$have\" | sort -V | head -n1)\" != \"11.5.1\" ]; then npm install -g npm@11.19.0; fi; npm --version"
      - run: git fetch origin 'refs/tags/ci/*:refs/tags/ci/*'
      - run: git fetch origin chant/lifecycle:chant/lifecycle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: chant-release-images
          path: dist/images
      - run: npx chant release stamp "$CHANT_RELEASE_LABEL"
      - run: npx chant release images "$CHANT_RELEASE_LABEL" --no-build -o "$RUNNER_TEMP/chant-release-digests.json"
      - run: echo "CHANT_RELEASE_DIGESTS=$RUNNER_TEMP/chant-release-digests.json" >> "$GITHUB_ENV"
      - run: node scripts/build-cli.mjs
      - run: npx chant release publish "$CHANT_RELEASE_LABEL" --yes
