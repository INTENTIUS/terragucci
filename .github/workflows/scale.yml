name: scale

on:
  workflow_dispatch:
    inputs:
      scale:
        description: 'The terralith scale: 136 is 10,069 resources, 1 is 79'
        required: true
        default: '136'
        type: string
      release:
        description: The published release to measure; empty for the newest
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: scale
  cancel-in-progress: false

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      pull-requests: write
    env:
      TGSCALE_RELEASE: '${{ inputs.release }}'
      SCALE: '${{ inputs.scale || ''136'' }}'
      TGSCALE_CAPACITY: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install just
        run: |
          { [ -x "/opt/chant/just-1.36.0/just" ] || (set -e; a="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')" && case "$a" in (amd64) w=x86_64 ;; (arm64) w=aarch64 ;; (*) echo "just 1.36.0: chant fetches it for amd64 and arm64, not $a" >&2; exit 1 ;; esac && f="just-1.36.0-$w-unknown-linux-musl.tar.gz" && t="$(mktemp -d)" && curl -fsSLo "$t/$f" "https://github.com/casey/just/releases/download/1.36.0/$f" && case "$a" in (amd64) want=bc7c9f377944f8de9cd0418b11d2955adebfa25a488c0b5e3dd2d2c0e9d732da ;; (arm64) want=bb3886b15e2cbcb9c0eb19956297d36de4eaef45b89d3f5fa5d1fc4ed3b5b51d ;; (*) want= ;; esac && curl -fsSLo "$t/sums" "https://github.com/casey/just/releases/download/1.36.0/just-1.36.0-$w-unknown-linux-musl.tar.gz.sha256sum" && line="$(sed -n "s#^\([0-9a-f]\{64\}\)  *[*.]*/*$f\$#\1#p" "$t/sums")" && { [ -n "$line" ] || { echo "just 1.36.0: $f is not in just-1.36.0-$w-unknown-linux-musl.tar.gz.sha256sum" >&2; exit 1; }; } && { [ -z "$want" ] || [ "$line" = "$want" ] || { echo "just 1.36.0: just-1.36.0-$w-unknown-linux-musl.tar.gz.sha256sum lists $line for $f; chant records $want" >&2; exit 1; }; } && want="$line" && echo "$want  $t/$f" | sha256sum -c - >/dev/null && sudo mkdir -p "/opt/chant/just-1.36.0" && tar -xzf "$t/$f" -C "$t" "just" && sudo install -m 0755 "$t/just" "/opt/chant/just-1.36.0/just"); } && sudo ln -sf "/opt/chant/just-1.36.0/just" /usr/local/bin/just
          just --version
      - name: Start the bench's stack
        run: just scale up
      - name: Run the bench
        run: |
          export TGSCALE_RELEASE="${TGSCALE_RELEASE#v}"
          just scale run "$SCALE"
          just scale record
      - name: Stop the bench's stack
        if: always()
        run: just scale down
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scale-record
          path: stack/scale/.state/runs/
          if-no-files-found: ignore
          retention-days: 90
      - name: Open a pull request with the record
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -eu
          if [ -z "$(git status --porcelain docs-site/src/data/scale.json)" ]; then
            echo "nothing changed"
            exit 0
          fi
          branch="scale/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs-site/src/data/scale.json
          git commit -m "docs: the scale bench record for $(jq -r '.runs[-1].release' docs-site/src/data/scale.json)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "docs: the scale bench record" --body "From the scale workflow, run ${GITHUB_RUN_ID}."
