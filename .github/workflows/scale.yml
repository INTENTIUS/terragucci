name: scale

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      scale:
        description: 'The terralith scale: 136 is 10,069 resources, 1 is 79'
        required: true
        default: '136'
        type: string
      release:
        description: The published release to measure; empty for the newest
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: scale
  cancel-in-progress: false

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
      pull-requests: write
    env:
      TGSCALE_RELEASE: '${{ github.event.release.tag_name && github.event.release.tag_name || inputs.release }}'
      SCALE: '${{ inputs.scale || ''136'' }}'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install just
        run: |
          curl -fsSL -o /tmp/just.tar.gz https://github.com/casey/just/releases/download/1.36.0/just-1.36.0-$(uname -m)-unknown-linux-musl.tar.gz
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo mv /tmp/just /usr/local/bin/just
          just --version
      - name: Start the bench's stack
        run: just scale up
      - name: Run the bench
        run: |
          export TGSCALE_RELEASE="${TGSCALE_RELEASE#v}"
          just scale run "$SCALE"
          just scale record
      - name: Stop the bench's stack
        if: always()
        run: just scale down
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scale-record
          path: stack/scale/.state/runs/
          if-no-files-found: ignore
          retention-days: 90
      - name: Open a pull request with the record
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |
          set -eu
          if [ -z "$(git status --porcelain docs-site/src/data/scale.json)" ]; then
            echo "nothing changed"
            exit 0
          fi
          branch="scale/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs-site/src/data/scale.json
          git commit -m "docs: the scale bench record for $(jq -r '.runs[-1].release' docs-site/src/data/scale.json)"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "docs: the scale bench record" --body "From the scale workflow, run ${GITHUB_RUN_ID}."
