name: diff-guard

on:
  workflow_dispatch:
    inputs:
      base:
        description: The branch to compare against
        required: true
        default: main
        type: string
      allow_revert:
        description: Let a deliberate revert through, as the revert label did
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: diff-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: '0'
      - name: The pull request undoes no commit main has
        run: scripts/diff-guard.sh "origin/$BASE_REF" "$HEAD_SHA"
        env:
          BASE_REF: '${{ inputs.base }}'
          HEAD_SHA: '${{ github.sha }}'
          DIFF_GUARD_ALLOW: '${{ inputs.allow_revert && ''1'' || '''' }}'
      - name: The pull request adds no binary outside LFS
        run: scripts/lfs-check.sh "origin/$BASE_REF" "$HEAD_SHA"
        env:
          BASE_REF: '${{ inputs.base }}'
          HEAD_SHA: '${{ github.sha }}'
