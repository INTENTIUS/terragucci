name: terragucci

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: '${{ github.ref != ''refs/heads/main'' }}'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install just
        run: |
          curl -fsSL -o /tmp/just.tar.gz https://github.com/casey/just/releases/download/1.36.0/just-1.36.0-$(uname -m)-unknown-linux-musl.tar.gz
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo mv /tmp/just /usr/local/bin/just
          just --version
      - name: Install OpenTofu
        run: |
          arch=$(uname -m); case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          curl -fsSL -o /tmp/tofu.tar.gz https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_$arch.tar.gz
          tar -xzf /tmp/tofu.tar.gz -C /tmp tofu
          sudo mv /tmp/tofu /usr/local/bin/tofu
          tofu version
      - name: Install Go
        run: |
          arch=$(uname -m); case "$arch" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; esac
          curl -fsSL -o /tmp/go.tar.gz https://go.dev/dl/go1.25.5.linux-$arch.tar.gz
          sudo tar -xzf /tmp/go.tar.gz -C /usr/local
          echo /usr/local/go/bin >> "$GITHUB_PATH"
          /usr/local/go/bin/go version
      - name: Install
        run: npm ci
      - name: Check
        run: just check
      - name: Workflows match their declarations
        run: just ci-check
