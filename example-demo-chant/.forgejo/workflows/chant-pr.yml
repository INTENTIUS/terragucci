name: chant-pr-demo

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CHANT_ENV: demo

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: docker
    container: public.ecr.aws/docker/library/node:22-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - run: command -v tofu >/dev/null 2>&1 || (curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh && sh /tmp/install-opentofu.sh --install-method standalone)
      - run: npm ci --no-audit --no-fund
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Plan the members this pull request reaches
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: chant components pr-plan --base "$BASE_SHA" --pr "$PR_NUMBER" --env demo --gate pr-apply --output .chant/pr --forge forgejo
      - name: Keep the plan report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: chant-pr-plan
          path: .chant/pr
          if-no-files-found: ignore
          include-hidden-files: true
  apply:
    if: github.event_name == 'push'
    runs-on: docker
    container: public.ecr.aws/docker/library/node:22-bookworm
    concurrency:
      group: chant-apply-demo
      cancel-in-progress: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - run: command -v tofu >/dev/null 2>&1 || (curl -fsSL https://get.opentofu.org/install-opentofu.sh -o /tmp/install-opentofu.sh && sh /tmp/install-opentofu.sh --install-method standalone)
      - run: npm ci --no-audit --no-fund
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Restore the record of an earlier attempt at this commit
        uses: https://code.forgejo.org/actions/cache/restore@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-demo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: chant-apply-demo-${{ github.sha }}-
      - name: Apply the plan a reviewer approved
        env:
          BASE_SHA: '${{ github.event.before }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: chant components pr-apply --base "$BASE_SHA" --env demo --gate pr-apply --output .chant/pr --forge forgejo --require-review --resume .chant/pr-resume/pr-apply.json
      - name: Keep the record for a re-run
        if: always()
        uses: https://code.forgejo.org/actions/cache/save@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-demo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the apply report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: chant-pr-apply
          path: .chant/pr
          if-no-files-found: ignore
          include-hidden-files: true
