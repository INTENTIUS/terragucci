# The demo's Terragrunt units: network, and app (reads network). A scenario's
# pull request adds ledger, and billing (reads ledger). Each unit is
# terraform_data with its own state in floci; the plan reports and run views go
# to the reports bucket there too, beside the Terraform demo's.
forge: forgejo
binary: tofu
gate: on-destructive
reports:
  bucket: s3://demo-reports
  endpoint: http://floci:4566
  prefix: demo
