# The demo's Terragrunt units: network, and app (reads network). A scenario's
# pull request adds ledger, and billing (reads ledger). Each unit is
# terraform_data with its own state in floci; the plan reports and run views go
# to the reports bucket there too, beside the Terraform demo's.
forge: forgejo
binary: tofu
gate: on-destructive
reports:
  bucket: s3://demo-reports
  endpoint: http://floci:4566
  prefix: demo
# Each job's metrics go to the stack's OpenTelemetry collector, and on to
# the Prometheus that behold's kiosk reads (stack/demo.sh up starts both).
# Metrics only, each gauge labelled with its commit and run. A collector that
# is down costs a job one log line, never its result.
env:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_TRACES_EXPORTER: none
  TERRAGUCCI_METRICS_PER_RUN: "true"
