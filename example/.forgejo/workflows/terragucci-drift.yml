# Generated by terragucci. The drift job is a chant drift Op (terragucci#1305), from .chant/ops/terragucci-drift.spec.json: edit terragucci.yml's drift and run terragucci init.
name: terragucci-drift

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

concurrency:
  group: terragucci-drift
  cancel-in-progress: false

jobs:
  terragucci-drift:
    runs-on: docker
    container: ghcr.io/intentius/terragucci-tofu:0.4.51-tofu1.13.1
    env:
      TG_TOKEN: '${{ github.token }}'
      TG_SHA: '${{ github.sha }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .chant/ops/terragucci-drift.sh
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          GH_TOKEN: '${{ github.token }}'
      - if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: terragucci-report-drift
          path: terragucci-report/
          if-no-files-found: ignore
