# Generated by terragucci.
# terragucci writes this file from terragucci.yml, or from its defaults when
# the repo has none. Change terragucci.yml and run `npx terragucci init`
# rather than editing it here.
# Every job runs in ghcr.io/intentius/terragucci-tofu:0.4.2-tofu1.13.1, pinned by digest.
name: terragucci

on:
  push:
    branches:
      - '**'
  pull_request: {}
  issue_comment:
    types:
      - created
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

concurrency:
  group: terragucci-${{ github.event_name == 'issue_comment' && format('comment-{0}', github.event.issue.number) || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: docker
    container:
      image: ghcr.io/intentius/terragucci-tofu:0.4.2-tofu1.13.1@sha256:8530efa0b64fb21c561313d7160176470a4bbfe996c03a9f7990f034985c1503
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    env:
      TG_BRANCH: '${{ github.event.repository.default_branch }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Format check and validate, every root
        run: |
          [ -n "${TG_NO_FORGE_TOKEN:-}" ] || exec env -u TG_TOKEN -u TG_MERGE_TOKEN -u GITHUB_TOKEN -u GH_TOKEN -u FORGEJO_TOKEN -u GITEA_TOKEN -u ACTIONS_RUNTIME_TOKEN TG_NO_FORGE_TOKEN=1 sh -e "$0"
          set -eu
          tofu fmt -check -recursive -diff .
          failed=0
          for dir in 'envs/dev/email' 'envs/dev/orders' 'envs/dev/payments' 'envs/dev/platform' 'envs/dev/search' 'envs/prod/email' 'envs/prod/orders' 'envs/prod/payments' 'envs/prod/platform' 'envs/prod/search' 'envs/staging/email' 'envs/staging/orders' 'envs/staging/payments' 'envs/staging/platform' 'envs/staging/search'; do
            tofu -chdir="$dir" init -backend=false -input=false -no-color >/dev/null
            terragucci check-root "$dir" --binary tofu || failed=1
          done
          terragucci check-policy || failed=1
          exit "$failed"
      - name: Keep the check report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: terragucci-check
          path: terragucci-check/
          if-no-files-found: ignore
  plan:
    runs-on: docker
    container:
      image: ghcr.io/intentius/terragucci-tofu:0.4.2-tofu1.13.1@sha256:8530efa0b64fb21c561313d7160176470a4bbfe996c03a9f7990f034985c1503
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      TG_SHA: '${{ github.event.pull_request.head.sha }}'
      TG_PR: '${{ github.event.pull_request.number }}'
    steps:
      - name: Say on the head that the plan started
        shell: bash
        env:
          TG_TOKEN: '${{ github.token }}'
        run: |
          export TG_FORGE=forgejo
          tg() { node --input-type=module -e 'import { writeFileSync, readFileSync } from "node:fs";
          const [cmd, ...a] = process.argv.slice(1);
          const e = process.env, gl = e.TG_FORGE === "gitlab", tok = e.TG_TOKEN;
          const MARK = "<!-- terragucci:plan";
          try {
            if (cmd === "oidc") {
              const r = await fetch(e.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=" + encodeURIComponent(a[1]), { headers: { authorization: "bearer " + e.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
              if (!r.ok) throw new Error("the OIDC token request answered " + r.status + "; the job needs permission to request an OIDC token");
              writeFileSync(a[0], (await r.json()).value, { mode: 0o600 });
            } else if (!tok) {
              console.log("terragucci: no forge token, so no " + cmd);
            } else {
              const api = gl ? e.CI_API_V4_URL : e.GITHUB_API_URL || e.GITHUB_SERVER_URL + "/api/v1";
              const repo = gl ? "projects/" + e.CI_PROJECT_ID : "repos/" + e.GITHUB_REPOSITORY;
              const call = async (m, p, b) => {
                const r = await fetch(api + "/" + p, { method: m, headers: { "content-type": "application/json", ...(gl ? { "private-token": tok } : { authorization: "token " + tok }) }, body: b ? JSON.stringify(b) : undefined });
                if (!r.ok) throw new Error(m + " " + p + " answered " + r.status);
                return r.status === 204 ? null : r.json();
              };
              const notes = (n) => gl ? repo + "/merge_requests/" + n + "/notes" : repo + "/issues/" + n + "/comments";
              const find = async (n) => (await call("GET", notes(n) + "?per_page=100")).find((c) => c.body.startsWith(MARK));
              const edit = (n, id, body) => gl ? call("PUT", notes(n) + "/" + id, { body }) : call("PATCH", repo + "/issues/comments/" + id, { body });
              if (cmd === "status") {
                const [context, state, description] = a;
                const url = gl ? e.CI_PIPELINE_URL : e.GITHUB_SERVER_URL + "/" + e.GITHUB_REPOSITORY + "/actions/runs/" + e.GITHUB_RUN_ID;
                const sha = e.TG_SHA;
                if (gl) await call("POST", repo + "/statuses/" + sha, { name: context, state: { pending: "running", success: "success", failure: "failed" }[state], description, target_url: url });
                else await call("POST", repo + "/statuses/" + sha, { context, state, description, target_url: url });
              } else if (cmd === "note") {
                const body = readFileSync(a[0], "utf-8"), old = await find(e.TG_PR);
                if (old) await edit(e.TG_PR, old.id, body); else await call("POST", notes(e.TG_PR), { body });
              } else if (cmd === "reply") {
                await call("POST", notes(e.TG_PR), { body: "terragucci: " + a[0] });
              } else if (cmd === "alive") {
                const run = await call("GET", repo + "/actions/runs/" + a[0]);
                console.log(["success", "failure", "cancelled", "skipped", "completed"].includes(run.status) ? "dead" : "alive");
              } else if (cmd === "stale") {
                const moved = a[0].split(",");
                const open = gl ? await call("GET", repo + "/merge_requests?state=opened&target_branch=" + a[1] + "&per_page=100") : await call("GET", repo + "/pulls?state=open&base=" + a[1] + "&per_page=100");
                for (const pr of open) {
                  const n = gl ? pr.iid : pr.number, note = await find(n);
                  if (!note || note.body.includes("<!-- terragucci:stale -->")) continue;
                  const hit = (note.body.match(/roots=(\S*) -->/)?.[1] ?? "").split(",").filter((r) => moved.includes(r));
                  if (!hit.length) continue;
                  const lines = note.body.split("\n");
                  lines.splice(1, 0, "> This plan is stale: " + a[1] + " moved under " + hit.join(", ") + ". Push to this pull request to plan again. <!-- terragucci:stale -->");
                  await edit(n, note.id, lines.join("\n"));
                }
              }
            }
          } catch (err) {
            console.log("terragucci: " + cmd + " failed: " + err.message);
            if (cmd === "oidc") process.exit(1);
          }' -- "$@"; }
          tg status terragucci/plan pending "planning"
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan the roots the change reaches and write the plan report
        shell: bash
        run: |
          [ -n "${TG_NO_FORGE_TOKEN:-}" ] || exec env -u TG_TOKEN -u TG_MERGE_TOKEN -u GITHUB_TOKEN -u GH_TOKEN -u FORGEJO_TOKEN -u GITEA_TOKEN -u ACTIONS_RUNTIME_TOKEN TG_NO_FORGE_TOKEN=1 bash --noprofile --norc -e -o pipefail "$0"
          set +e -uo pipefail
          terragucci stage tf-plan --out terragucci-report --binary tofu --layers 'envs/dev/platform,envs/prod/platform,envs/staging/platform;envs/dev/email,envs/dev/orders,envs/dev/payments,envs/dev/search,envs/prod/email,envs/prod/orders,envs/prod/payments,envs/prod/search,envs/staging/email,envs/staging/orders,envs/staging/payments,envs/staging/search' --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          rc=$?
          if [ ! -f terragucci-report/report.json ]; then
            mkdir -p terragucci-report && echo "failure the plan report was not written" >terragucci-report/plan-status.txt
            exit 1
          fi
          counts="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8"));const n=(a)=>r.named.filter((x)=>a.includes(x.action)).length;const f=n(["refused"]);console.log((f?f+" failed: ":"")+r.roots.length+" roots, "+r.groups.length+" groups, "+n(["delete","replace"])+" destroys")' terragucci-report/report.json)"
          if [ -n "${TG_PR:-}" ]; then
            # The first line says which roots the note covers, so an apply can mark it stale.
            { echo "<!-- terragucci:plan roots=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8")).roots.map((x)=>x.path).join(","))' terragucci-report/report.json) -->"; cat terragucci-report/note.md; } >terragucci-report/plan-note.md
          fi
          if [ "$rc" -ne 0 ]; then echo "failure $counts" >terragucci-report/plan-status.txt; exit 1; fi
          echo "success $counts" >terragucci-report/plan-status.txt
      - name: Keep the plan report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: terragucci-report
          path: terragucci-report/
          if-no-files-found: ignore
  plan-note:
    runs-on: docker
    container:
      image: ghcr.io/intentius/terragucci-tofu:0.4.2-tofu1.13.1@sha256:8530efa0b64fb21c561313d7160176470a4bbfe996c03a9f7990f034985c1503
    needs: plan
    if: always() && (needs.plan.result == 'success' || needs.plan.result == 'failure') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      TG_TOKEN: '${{ github.token }}'
      TG_PLAN_RESULT: '${{ needs.plan.result }}'
      TG_SHA: '${{ github.event.pull_request.head.sha }}'
      TG_PR: '${{ github.event.pull_request.number }}'
    steps:
      - name: Fetch the plan report
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: terragucci-report
          path: terragucci-report
      - name: Post the plan note and terragucci/plan
        if: always()
        shell: bash
        run: |
          set -u
          terragucci plan-note --forge forgejo --report terragucci-report --plan-result "${TG_PLAN_RESULT:-}"
  replan:
    runs-on: docker
    container:
      image: ghcr.io/intentius/terragucci-tofu:0.4.2-tofu1.13.1@sha256:8530efa0b64fb21c561313d7160176470a4bbfe996c03a9f7990f034985c1503
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/terragucci') && !startsWith(github.event.comment.body, '/terragucci apply')
    concurrency:
      group: terragucci-replan-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      go: '${{ steps.decide.outputs.go }}'
      pr: '${{ steps.decide.outputs.pr }}'
      sha: '${{ steps.decide.outputs.sha }}'
      root: '${{ steps.decide.outputs.root }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - id: decide
        name: Read the comment and decide whether it re-plans
        shell: bash
        env:
          TG_TOKEN: '${{ github.token }}'
        run: |
          set +e -uo pipefail
          export TG_FORGE=forgejo
          tg() { node --input-type=module -e 'import { writeFileSync, readFileSync } from "node:fs";
          const [cmd, ...a] = process.argv.slice(1);
          const e = process.env, gl = e.TG_FORGE === "gitlab", tok = e.TG_TOKEN;
          const MARK = "<!-- terragucci:plan";
          try {
            if (cmd === "oidc") {
              const r = await fetch(e.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=" + encodeURIComponent(a[1]), { headers: { authorization: "bearer " + e.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
              if (!r.ok) throw new Error("the OIDC token request answered " + r.status + "; the job needs permission to request an OIDC token");
              writeFileSync(a[0], (await r.json()).value, { mode: 0o600 });
            } else if (!tok) {
              console.log("terragucci: no forge token, so no " + cmd);
            } else {
              const api = gl ? e.CI_API_V4_URL : e.GITHUB_API_URL || e.GITHUB_SERVER_URL + "/api/v1";
              const repo = gl ? "projects/" + e.CI_PROJECT_ID : "repos/" + e.GITHUB_REPOSITORY;
              const call = async (m, p, b) => {
                const r = await fetch(api + "/" + p, { method: m, headers: { "content-type": "application/json", ...(gl ? { "private-token": tok } : { authorization: "token " + tok }) }, body: b ? JSON.stringify(b) : undefined });
                if (!r.ok) throw new Error(m + " " + p + " answered " + r.status);
                return r.status === 204 ? null : r.json();
              };
              const notes = (n) => gl ? repo + "/merge_requests/" + n + "/notes" : repo + "/issues/" + n + "/comments";
              const find = async (n) => (await call("GET", notes(n) + "?per_page=100")).find((c) => c.body.startsWith(MARK));
              const edit = (n, id, body) => gl ? call("PUT", notes(n) + "/" + id, { body }) : call("PATCH", repo + "/issues/comments/" + id, { body });
              if (cmd === "status") {
                const [context, state, description] = a;
                const url = gl ? e.CI_PIPELINE_URL : e.GITHUB_SERVER_URL + "/" + e.GITHUB_REPOSITORY + "/actions/runs/" + e.GITHUB_RUN_ID;
                const sha = e.TG_SHA;
                if (gl) await call("POST", repo + "/statuses/" + sha, { name: context, state: { pending: "running", success: "success", failure: "failed" }[state], description, target_url: url });
                else await call("POST", repo + "/statuses/" + sha, { context, state, description, target_url: url });
              } else if (cmd === "note") {
                const body = readFileSync(a[0], "utf-8"), old = await find(e.TG_PR);
                if (old) await edit(e.TG_PR, old.id, body); else await call("POST", notes(e.TG_PR), { body });
              } else if (cmd === "reply") {
                await call("POST", notes(e.TG_PR), { body: "terragucci: " + a[0] });
              } else if (cmd === "alive") {
                const run = await call("GET", repo + "/actions/runs/" + a[0]);
                console.log(["success", "failure", "cancelled", "skipped", "completed"].includes(run.status) ? "dead" : "alive");
              } else if (cmd === "stale") {
                const moved = a[0].split(",");
                const open = gl ? await call("GET", repo + "/merge_requests?state=opened&target_branch=" + a[1] + "&per_page=100") : await call("GET", repo + "/pulls?state=open&base=" + a[1] + "&per_page=100");
                for (const pr of open) {
                  const n = gl ? pr.iid : pr.number, note = await find(n);
                  if (!note || note.body.includes("<!-- terragucci:stale -->")) continue;
                  const hit = (note.body.match(/roots=(\S*) -->/)?.[1] ?? "").split(",").filter((r) => moved.includes(r));
                  if (!hit.length) continue;
                  const lines = note.body.split("\n");
                  lines.splice(1, 0, "> This plan is stale: " + a[1] + " moved under " + hit.join(", ") + ". Push to this pull request to plan again. <!-- terragucci:stale -->");
                  await edit(n, note.id, lines.join("\n"));
                }
              }
            }
          } catch (err) {
            console.log("terragucci: " + cmd + " failed: " + err.message);
            if (cmd === "oidc") process.exit(1);
          }' -- "$@"; }
          terragucci comment --layers 'envs/dev/platform,envs/prod/platform,envs/staging/platform;envs/dev/email,envs/dev/orders,envs/dev/payments,envs/dev/search,envs/prod/email,envs/prod/orders,envs/prod/payments,envs/prod/search,envs/staging/email,envs/staging/orders,envs/staging/payments,envs/staging/search' --forge forgejo --out terragucci-comment.json || exit 1
          read -r TG_PR TG_SHA TG_BASE TG_ROOT <<EOF
          $(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8"));console.log(d.go?[d.pr,d.sha,d.base,d.root||"-"].join(" "):"")' terragucci-comment.json)
          EOF
          [ -n "$TG_PR" ] || exit 0
          [ "$TG_ROOT" = "-" ] && TG_ROOT=""
          export TG_SHA
          { echo "go=1"; echo "pr=$TG_PR"; echo "sha=$TG_SHA"; echo "base=$TG_BASE"; echo "root=$TG_ROOT"; } >>"$GITHUB_OUTPUT"
          [ -n "$TG_ROOT" ] || tg status terragucci/plan pending "planning"
      - if: steps.decide.outputs.go == '1'
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.decide.outputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false
      - if: steps.decide.outputs.go == '1'
        name: Re-plan the pull request on request and write the plan report
        shell: bash
        env:
          TG_PR: '${{ steps.decide.outputs.pr }}'
          TG_SHA: '${{ steps.decide.outputs.sha }}'
          TG_ROOT: '${{ steps.decide.outputs.root }}'
          TG_BASE: origin/${{ steps.decide.outputs.base }}
        run: |
          [ -n "${TG_NO_FORGE_TOKEN:-}" ] || exec env -u TG_TOKEN -u TG_MERGE_TOKEN -u GITHUB_TOKEN -u GH_TOKEN -u FORGEJO_TOKEN -u GITEA_TOKEN -u ACTIONS_RUNTIME_TOKEN TG_NO_FORGE_TOKEN=1 bash --noprofile --norc -e -o pipefail "$0"
          set +e -uo pipefail
          if [ "$(git rev-parse HEAD)" != "${TG_SHA:-}" ]; then echo "terragucci: the pull request moved while the comment was read; its push plans it" >&2; exit 0; fi
          terragucci stage tf-plan --out terragucci-report --binary tofu --layers 'envs/dev/platform,envs/prod/platform,envs/staging/platform;envs/dev/email,envs/dev/orders,envs/dev/payments,envs/dev/search,envs/prod/email,envs/prod/orders,envs/prod/payments,envs/prod/search,envs/staging/email,envs/staging/orders,envs/staging/payments,envs/staging/search' --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" ${TG_ROOT:+--root "$TG_ROOT"}
          rc=$?
          if [ ! -f terragucci-report/report.json ]; then
            mkdir -p terragucci-report && echo "failure the plan report was not written" >terragucci-report/plan-status.txt
            exit 1
          fi
          counts="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8"));const n=(a)=>r.named.filter((x)=>a.includes(x.action)).length;const f=n(["refused"]);console.log((f?f+" failed: ":"")+r.roots.length+" roots, "+r.groups.length+" groups, "+n(["delete","replace"])+" destroys")' terragucci-report/report.json)"
          if [ -n "${TG_PR:-}" ]; then
            # The first line says which roots the note covers, so an apply can mark it stale.
            { echo "<!-- terragucci:plan roots=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8")).roots.map((x)=>x.path).join(","))' terragucci-report/report.json) -->"; cat terragucci-report/note.md; } >terragucci-report/plan-note.md
          fi
          if [ "$rc" -ne 0 ]; then echo "failure $counts" >terragucci-report/plan-status.txt; exit 1; fi
          echo "success $counts" >terragucci-report/plan-status.txt
      - name: Keep the plan report
        if: always() && steps.decide.outputs.go == '1'
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: terragucci-report-replan
          path: terragucci-report/
          if-no-files-found: ignore
  replan-note:
    runs-on: docker
    container:
      image: ghcr.io/intentius/terragucci-tofu:0.4.2-tofu1.13.1@sha256:8530efa0b64fb21c561313d7160176470a4bbfe996c03a9f7990f034985c1503
    needs: replan
    if: always() && (needs.replan.result == 'success' || needs.replan.result == 'failure') && needs.replan.outputs.go == '1'
    env:
      TG_TOKEN: '${{ github.token }}'
      TG_PLAN_RESULT: '${{ needs.replan.result }}'
      TG_PR: '${{ needs.replan.outputs.pr }}'
      TG_SHA: '${{ needs.replan.outputs.sha }}'
      TG_ROOT: '${{ needs.replan.outputs.root }}'
    steps:
      - name: Fetch the plan report
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: terragucci-report-replan
          path: terragucci-report
      - name: Post the plan note and terragucci/plan
        if: always()
        shell: bash
        run: |
          set -u
          terragucci plan-note --forge forgejo --report terragucci-report --plan-result "${TG_PLAN_RESULT:-}" ${TG_ROOT:+--root "$TG_ROOT"}
  fmt:
    runs-on: docker
    container:
      image: ghcr.io/intentius/terragucci-tofu:0.4.2-tofu1.13.1@sha256:8530efa0b64fb21c561313d7160176470a4bbfe996c03a9f7990f034985c1503
    needs: check
    if: always() && needs.check.result == 'failure' && github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    env:
      TG_TOKEN: '${{ github.token }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Commit the formatting
        shell: bash
        run: |
          set -u
          export FORGEJO_TOKEN="$TG_TOKEN"
          terragucci respond fmt --mode apply --binary tofu --branch "$GITHUB_REF_NAME" || true
  apply-comment:
    runs-on: docker
    container:
      image: ghcr.io/intentius/terragucci-tofu:0.4.2-tofu1.13.1@sha256:8530efa0b64fb21c561313d7160176470a4bbfe996c03a9f7990f034985c1503
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/terragucci apply')
    concurrency:
      group: terragucci-apply-${{ github.repository }}
      cancel-in-progress: false
    env:
      TG_TOKEN: '${{ github.token }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply a merged pull request on request, from its merge commit
        shell: bash
        run: |
          set +e -uo pipefail
          export TG_FORGE=forgejo
          tg() { node --input-type=module -e 'import { writeFileSync, readFileSync } from "node:fs";
          const [cmd, ...a] = process.argv.slice(1);
          const e = process.env, gl = e.TG_FORGE === "gitlab", tok = e.TG_TOKEN;
          const MARK = "<!-- terragucci:plan";
          try {
            if (cmd === "oidc") {
              const r = await fetch(e.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=" + encodeURIComponent(a[1]), { headers: { authorization: "bearer " + e.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
              if (!r.ok) throw new Error("the OIDC token request answered " + r.status + "; the job needs permission to request an OIDC token");
              writeFileSync(a[0], (await r.json()).value, { mode: 0o600 });
            } else if (!tok) {
