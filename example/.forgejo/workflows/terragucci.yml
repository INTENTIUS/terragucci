# Generated by terragucci.
# terragucci writes this file from terragucci.yml, or from its defaults when
# the repo has none. Change terragucci.yml and run `npx terragucci init`
# rather than editing it here.
name: terragucci

on:
  push:
    branches:
      - '**'

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

jobs:
  check:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install tofu 1.13.1
        run: |
          set -eu
          case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; *) arch=amd64 ;; esac
          dir="${TOFU_INSTALL_DIR:-${RUNNER_TEMP:-/tmp}/terragucci-bin}/tofu-1.13.1"
          if [ ! -x "$dir/tofu" ]; then
            mkdir -p "$dir"
            tmp="$(mktemp -d "$dir.XXXX")"
            curl -fsSL "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_${arch}.tar.gz" | tar -xz -C "$tmp" tofu
            mv -f "$tmp/tofu" "$dir/tofu"
            rm -rf "$tmp"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: Format check and validate, every root
        run: |
          set -eu
          tofu fmt -check -recursive -diff .
          for dir in 'envs/dev/email' 'envs/dev/orders' 'envs/dev/payments' 'envs/dev/platform' 'envs/dev/search' 'envs/prod/email' 'envs/prod/orders' 'envs/prod/payments' 'envs/prod/platform' 'envs/prod/search' 'envs/staging/email' 'envs/staging/orders' 'envs/staging/payments' 'envs/staging/platform' 'envs/staging/search'; do
            tofu -chdir="$dir" init -backend=false -input=false -no-color >/dev/null
            tofu -chdir="$dir" validate -no-color >/dev/null
            echo "valid $dir"
          done
  apply:
    runs-on: docker
    needs: check
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install tofu 1.13.1
        run: |
          set -eu
          case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; *) arch=amd64 ;; esac
          dir="${TOFU_INSTALL_DIR:-${RUNNER_TEMP:-/tmp}/terragucci-bin}/tofu-1.13.1"
          if [ ! -x "$dir/tofu" ]; then
            mkdir -p "$dir"
            tmp="$(mktemp -d "$dir.XXXX")"
            curl -fsSL "https://github.com/opentofu/opentofu/releases/download/v1.13.1/tofu_1.13.1_linux_${arch}.tar.gz" | tar -xz -C "$tmp" tofu
            mv -f "$tmp/tofu" "$dir/tofu"
            rm -rf "$tmp"
          fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: Apply every root
        shell: bash
        run: |
          set -uo pipefail
          # Each root's output goes to its own log, printed when the root is done.
          apply_root() {
            local dir="$1" log
            log="$(mktemp)"
            if tofu -chdir="$dir" init -input=false -no-color >"$log" 2>&1 &&
              tofu -chdir="$dir" apply -auto-approve -input=false -no-color >>"$log" 2>&1; then
              echo "applied $dir: $(grep -o 'Resources: .*destroyed' "$log" | tail -1)"
            else
              echo "FAILED $dir"
              sed 's/^/    /' "$log"
              rm -f "$log"
              return 1
            fi
            rm -f "$log"
          }
          apply_together() {
            local pids=() rc=0
            for dir in "$@"; do apply_root "$dir" & pids+=("$!"); done
            for pid in "${pids[@]}"; do wait "$pid" || rc=1; done
            return $rc
          }
          apply_together 'envs/dev/platform' 'envs/prod/platform' 'envs/staging/platform' || exit 1
          apply_together 'envs/dev/email' 'envs/dev/orders' 'envs/dev/payments' 'envs/dev/search' 'envs/prod/email' 'envs/prod/orders' 'envs/prod/payments' 'envs/prod/search' 'envs/staging/email' 'envs/staging/orders' 'envs/staging/payments' 'envs/staging/search' || exit 1
          echo "all roots applied"
