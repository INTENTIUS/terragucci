# The demo's four roots: network, app (reads network), edge (reads app) and
# other (reads nothing). Each is terraform_data with its own state in floci;
# the plan reports and run views go to the reports bucket there too.
forge: forgejo
binary: tofu
gate: on-destructive
reports:
  bucket: s3://demo-reports
  endpoint: http://floci:4566
  prefix: demo
# The cost line in each plan note comes from a stub with a fixed price per
# terraform_data (scripts/cost.mjs), not from a pricing service. The note
# names it "cost-stub".
cost:
  command: scripts/cost-stub
