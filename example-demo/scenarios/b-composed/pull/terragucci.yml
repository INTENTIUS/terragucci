# The demo's four roots: network, app (reads network), edge (reads app) and
# other (reads nothing). Each is terraform_data with its own state in floci;
# the plan reports and run views go to the reports bucket there too.
forge: forgejo
binary: tofu
# Every job runs in the tofu CI image with SQL Yodeler added
# (stack/demo-yodel/Dockerfile), which app's schema migrations run on.
image: terragucci-demo-tofu:local
gate: on-destructive
reports:
  bucket: s3://demo-reports
  endpoint: http://floci:4566
  prefix: demo
# The cost line in each plan note comes from a stub with a fixed price per
# terraform_data (scripts/cost.mjs), not from a pricing service. The note
# names it "cost-stub".
cost:
  command: scripts/cost-stub
# Scenario 6 only (stack/demo.sh, b-composed): the roots this change reaches,
# and the roots they read, plan as one plan and apply as one apply, each
# keeping its own state. The base has no such key, and the reset forces main
# back to it, so every other scenario applies in waves.
waves:
  compose: true
