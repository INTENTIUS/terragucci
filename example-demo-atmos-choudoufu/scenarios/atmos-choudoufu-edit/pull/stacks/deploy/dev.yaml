# One stack, three components. Values move between components with
# !terraform.output, as in any Atmos repo; depends_on orders them.
vars:
  stage: dev

terraform:
  backend_type: s3
  backend:
    s3:
      bucket: demo-atmos-choudoufu-state
      key: terraform.tfstate
      region: us-east-1
      use_path_style: true
      skip_credentials_validation: true
      skip_metadata_api_check: true
      skip_requesting_account_id: true

components:
  terraform:
    network:
      vars:
        http_proxy_port: 8090
        admin_port: 9000
        subnet_a_cidr: 10.0.1.0/24
    app:
      settings:
        depends_on:
          1:
            component: network
      vars:
        vpc_id: !terraform.output network vpc_id
        subnet_a_id: !terraform.output network subnet_a_id
        http_proxy_port: !terraform.output network http_proxy_port
        admin_port: !terraform.output network admin_port
    edge:
      settings:
        depends_on:
          1:
            component: network
          2:
            component: app
      vars:
        listener_port: !terraform.output app listener_port
        admin_listener_port: !terraform.output app admin_listener_port
        subnet_a_cidr: !terraform.output network subnet_a_cidr
