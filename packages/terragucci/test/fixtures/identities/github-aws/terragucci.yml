# GitHub, AWS: prod and dev environments with their own roles, an audience per stage, and a root in no environment.
forge: github
binary: tofu
drift: "0 4 * * *"
runner:
  default: ubuntu-latest
  apply: { group: deployers, labels: [self-hosted, linux] }
oidc:
  plan_role: arn:aws:iam::111111111111:role/shared-plan
  apply_role: arn:aws:iam::111111111111:role/shared-apply
  audience: { plan: terragucci-plan, apply: terragucci-apply }
environments:
  prod:
    roots: ["envs/prod/**"]
    gate: always
    oidc:
      plan_role: arn:aws:iam::222222222222:role/prod-plan
      apply_role: arn:aws:iam::222222222222:role/prod-apply
  dev:
    roots: ["envs/dev/**"]
    oidc:
      plan_role: arn:aws:iam::333333333333:role/dev-plan
      apply_role: arn:aws:iam::333333333333:role/dev-apply
