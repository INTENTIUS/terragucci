# A control repo: one GitLab project with prod and dev environments, AWS roles and an audience per stage from the defaults.
defaults:
  binary: tofu
  oidc:
    plan_role: arn:aws:iam::666666666666:role/plan
    apply_role: arn:aws:iam::666666666666:role/apply
    audience: { plan: terragucci-plan, apply: terragucci-apply, drift: terragucci-drift }
projects:
  gitlab.com/acme/platform/infra:
    drift: "0 4 * * *"
    environments:
      prod:
        roots: ["envs/prod/**"]
        oidc:
          plan_role: arn:aws:iam::777777777777:role/prod-plan
          apply_role: arn:aws:iam::777777777777:role/prod-apply
      dev:
        roots: ["envs/dev/**"]
