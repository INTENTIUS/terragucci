          tg status terragucci/apply pending "applying"
          outcome="$(mktemp)"
          log="$(mktemp)"
          TG_OUTCOME="$outcome" terragucci stage tf-apply --wave 1 --layers 'network;app,cache' --binary tofu --gate on-destroy --stand-down 2>&1 | tee "$log"
