          rc=$?
          terragucci plan-handoff --report terragucci-report --env default --exit "$rc"
          PLAN
  plan-note:
    needs:
      - plan
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.plan.result == 'success' || needs.plan.result == 'failure')
