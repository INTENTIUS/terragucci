  apply-comment:
    runs-on:
      - self-hosted
      - prod
    container:
      image: img:1
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/terragucci apply')
    permissions:
      contents: write
      statuses: write
      pull-requests: write
    env:
      TF_VAR_db_password: '${{ secrets.TF_VAR_db_password }}'
      TF_VAR_region: '${{ vars.TF_VAR_region }}'
      TG_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Apply a merged pull request on request, from its merge commit
        shell: bash
        run: |
          set +e -uo pipefail
          export TG_FORGE=github
          tg() { case "$1" in status|note|reply|stale) terragucci post "$@" ;; *) node --input-type=module -e 'const [cmd, ...a] = process.argv.slice(1);
          const e = process.env, gl = e.TG_FORGE === "gitlab", tok = e.TG_TOKEN;
          try {
            if (!tok) {
              console.log("terragucci: no forge token, so no " + cmd);
            } else if (cmd === "alive") {
              const api = gl ? e.CI_API_V4_URL : e.GITHUB_API_URL || e.GITHUB_SERVER_URL + "/api/v1";
              const repo = gl ? "projects/" + e.CI_PROJECT_ID : "repos/" + e.GITHUB_REPOSITORY;
              const r = await fetch(api + "/" + repo + "/actions/runs/" + a[0], { headers: { "content-type": "application/json", ...(gl ? { "private-token": tok } : { authorization: "token " + tok }) } });
              if (!r.ok) throw new Error("GET run " + a[0] + " answered " + r.status);
              const run = await r.json();
              console.log(["success", "failure", "cancelled", "skipped", "completed"].includes(run.status) ? "dead" : "alive");
            }
          } catch (err) {
            console.log("terragucci: " + cmd + " failed: " + err.message);
          }' -- "$@" ;; esac; }
          terragucci comment-apply --layers 'network;app,cache' --out terragucci-comment.json || exit 1
          read -r TG_PR TG_SHA TG_WAVE <<EOF
          $(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8"));console.log(d.go?[d.pr,d.sha,d.wave||"-"].join(" "):"")' terragucci-comment.json)
          EOF
          [ -n "$TG_PR" ] || exit 0
          export TG_PR TG_SHA
          last=2
          [ "$TG_WAVE" = "-" ] || last="$TG_WAVE"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git checkout --quiet --detach "$TG_SHA" || { tg reply "could not check out the merge commit ${TG_SHA:0:8}, so nothing was applied: $run_url"; exit 1; }
          tg status terragucci/apply pending "applying on a comment"
          outcome="$(mktemp)"
          log="$(mktemp)"
          done_waves=""
          for wave in $(seq 1 "$last"); do
            : >"$outcome"
            TG_OUTCOME="$outcome" terragucci stage tf-apply --wave "$wave" --layers 'network;app,cache' --binary tofu --gate on-destructive --on-held refuse 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            case "$rc" in
              0) done_waves="${done_waves:+$done_waves, }$wave" ;;
              3)
                tg status terragucci/apply pending "$(cat "$outcome")"
                digest="$(sed -n 's/.*--plan \([^ ]*\).*/\1/p' "$outcome")"
                cmd="$(sed -n 's/^wave [0-9]* waits: //p' "$outcome")"
                tg reply "wave $wave waits for an approval of its set digest $digest, so nothing in it was applied${done_waves:+ (applied: wave $done_waves)}. A comment approves nothing: approve the plans with \`$cmd\` and comment \`/terragucci apply\` again. $run_url"
                exit 3 ;;
              4)
                tg status terragucci/apply failure "$(cat "$outcome")"
                terragucci respond wave-refused --wave "$wave" --approved terragucci-report/approved --current terragucci-report/current || true
                tg reply "wave $wave was refused: its plans changed since it was approved, so nothing in it was applied (${done_waves:+applied: wave $done_waves; }$(cat "$outcome")). $run_url"
                exit 4 ;;
              5)
                tg status terragucci/apply failure "$(cat "$outcome")"
                tg reply "wave $wave was not applied: another run is applying what it changes (${done_waves:+applied: wave $done_waves; }$(cat "$outcome")). Comment \`/terragucci apply\` again once that run is done. $run_url"
                exit 5 ;;
              *)
                tg status terragucci/apply failure "an apply failed"
                terragucci respond apply-failed --log "$log" || true
                why="$(cat "$outcome")"
                tg reply "wave $wave did not apply${why:+ ($why)}${done_waves:+; applied: wave $done_waves}. The run has the log: $run_url"
                exit 1 ;;
            esac
          done
