            : >"$outcome"
            TG_OUTCOME="$outcome" terragucci stage tf-apply --wave "$wave" --layers 'network;app,cache' --binary tofu --gate on-destroy --on-held refuse 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            case "$rc" in
              0) done_waves="${done_waves:+$done_waves, }$wave" ;;
              3)
                tg status terragucci/apply pending "$(cat "$outcome")"
