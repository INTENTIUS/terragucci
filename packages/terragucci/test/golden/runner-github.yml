      - name: Keep the apply report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terragucci-report-apply-comment
          path: terragucci-report/
          if-no-files-found: ignore
  ephemeral:
    runs-on:
