        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terragucci-report-apply-comment
          path: terragucci-report/
          if-no-files-found: ignore
  ephemeral:
    runs-on:
      - self-hosted
      - prod
    container:
      image: img:1
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: terragucci-ephemeral-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      TF_VAR_db_password: '${{ secrets.TF_VAR_db_password }}'
      TF_VAR_region: '${{ vars.TF_VAR_region }}'
      TG_TOKEN: '${{ github.token }}'
      TG_PR: '${{ github.event.pull_request.number }}'
      TG_SHA: '${{ github.event.pull_request.head.sha }}'
      TG_ACTION: '${{ github.event.action }}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the pull request's copy of the ephemeral roots, or destroy it once it closes
        shell: bash
        run: |
          if [ "${TG_ACTION:-}" = closed ]; then
            terragucci ephemeral down --pr "$TG_PR" --reason closed --binary tofu
          else
            terragucci ephemeral up --pr "$TG_PR" --head "$TG_SHA" --binary tofu
          fi
  apply-wave-1:
    runs-on:
