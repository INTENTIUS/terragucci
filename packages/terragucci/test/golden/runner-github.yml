      - name: Fetch the earlier waves' outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: terragucci-report-apply-wave-*
          path: terragucci-earlier
      - name: Apply wave 2 of 2
        shell: bash
        run: |
          set +e -uo pipefail
          export TG_FORGE=github
          tg() { case "$1" in status|note|reply|stale) terragucci post "$@" ;; *) node --input-type=module -e 'import { writeFileSync } from "node:fs";
          const [cmd, ...a] = process.argv.slice(1);
          const e = process.env, gl = e.TG_FORGE === "gitlab", tok = e.TG_TOKEN;
          try {
            if (cmd === "oidc") {
              const r = await fetch(e.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=" + encodeURIComponent(a[1]), { headers: { authorization: "bearer " + e.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
              if (!r.ok) throw new Error("the OIDC token request answered " + r.status + "; the job needs permission to request an OIDC token");
              writeFileSync(a[0], (await r.json()).value, { mode: 0o600 });
            } else if (!tok) {
              console.log("terragucci: no forge token, so no " + cmd);
            } else if (cmd === "alive") {
              const api = gl ? e.CI_API_V4_URL : e.GITHUB_API_URL || e.GITHUB_SERVER_URL + "/api/v1";
              const repo = gl ? "projects/" + e.CI_PROJECT_ID : "repos/" + e.GITHUB_REPOSITORY;
              const r = await fetch(api + "/" + repo + "/actions/runs/" + a[0], { headers: { "content-type": "application/json", ...(gl ? { "private-token": tok } : { authorization: "token " + tok }) } });
              if (!r.ok) throw new Error("GET run " + a[0] + " answered " + r.status);
              const run = await r.json();
              console.log(["success", "failure", "cancelled", "skipped", "completed"].includes(run.status) ? "dead" : "alive");
            }
          } catch (err) {
            console.log("terragucci: " + cmd + " failed: " + err.message);
            if (cmd === "oidc") process.exit(1);
          }' -- "$@" ;; esac; }
          tip="$([ -z "${GITHUB_REF_NAME:-}" ] || git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" 2>/dev/null | cut -f1)"
          if [ -n "$tip" ] && [ "$tip" != "${GITHUB_SHA:-}" ]; then
            echo "a newer push to ${GITHUB_REF_NAME} applies everything; standing down"
            tg status terragucci/apply success "superseded by a newer push"
            exit 0
          fi
          outcome="$(mktemp)"
          log="$(mktemp)"
          TG_OUTCOME="$outcome" terragucci stage tf-apply --wave 2 --layers 'network;app,cache' --binary tofu --gate on-destructive --stand-down --after terragucci-earlier 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          case "$rc" in
            0) ;;
            3) tg status terragucci/apply pending "$(cat "$outcome")"; exit 3 ;;
            4) tg status terragucci/apply failure "$(cat "$outcome")"; terragucci respond wave-refused --wave 2 --approved terragucci-report/approved --current terragucci-report/current || true; exit 4 ;;
            6) tg status terragucci/apply success "superseded by a newer push"; exit 0 ;;
            *) tg status terragucci/apply failure "an apply failed"; terragucci respond apply-failed --log "$log" || true; exit 1 ;;
          esac
          tg status terragucci/apply success "3 roots in 2 groups applied"
          echo "all roots applied"
      - name: Keep the apply report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terragucci-report-apply-wave-2
          path: terragucci-report/
          if-no-files-found: ignore
  tips:
    runs-on:
      - self-hosted
      - linux
    container:
      image: img:1
    needs: apply-wave-2
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: terragucci-tips-${{ github.repository }}
      cancel-in-progress: false
    env:
      TG_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Open a pull request for each tip
        shell: bash
        run: |
          set -u
          export GITHUB_TOKEN="$TG_TOKEN"
          terragucci respond tips --mode apply --binary tofu || true
  publish:
    runs-on:
      - self-hosted
      - linux
    container:
      image: img:1
    needs: apply-wave-2
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    concurrency:
      group: terragucci-publish-${{ github.repository }}
      cancel-in-progress: false
    env:
      TERRAGUCCI_REGISTRY_USER: '${{ secrets.TERRAGUCCI_REGISTRY_USER }}'
      TERRAGUCCI_REGISTRY_PASSWORD: '${{ secrets.TERRAGUCCI_REGISTRY_PASSWORD }}'
      TERRAGUCCI_REGISTRY_INSECURE: '${{ secrets.TERRAGUCCI_REGISTRY_INSECURE }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Publish the modules that changed
        shell: bash
        run: |
          set -eu
          terragucci publish
  drift:
    runs-on: drift-runner
    container:
      image: img:1
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.pr == '')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      TF_VAR_db_password: '${{ secrets.TF_VAR_db_password }}'
      TF_VAR_region: '${{ vars.TF_VAR_region }}'
      TG_TOKEN: '${{ github.token }}'
      TG_SHA: '${{ github.sha }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Plan every root against what exists, and keep the drift issue
        shell: bash
        run: |
          set +e -uo pipefail
          terragucci stage tf-drift --out terragucci-report --binary tofu --forge github --layers 'network;app,cache' --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          rc=$?
          export GITHUB_TOKEN="$TG_TOKEN"
          if [ "$rc" -eq 0 ]; then terragucci respond drift --mode apply --binary tofu || true; fi
          exit "$rc"
      - name: Keep the drift report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terragucci-report-drift
          path: terragucci-report/
          if-no-files-found: ignore
