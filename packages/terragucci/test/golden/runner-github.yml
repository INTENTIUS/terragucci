# Generated by terragucci.
# terragucci writes this file from terragucci.yml, or from its defaults when
# the repo has none. Change terragucci.yml and run `npx terragucci init`
# rather than editing it here.
# Every job runs in img:1; init pins its digest once the image is published.
name: terragucci

on:
  push:
    branches:
      - '**'
  pull_request: {}
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  workflow_dispatch:
    inputs:
      pr:
        description: The number of a pull request to re-plan
        required: false
        type: string
      root:
        description: One root of it to re-plan, a path from the repository root
        required: false
        type: string

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

jobs:
  check:
    runs-on:
      - self-hosted
      - linux
    container:
      image: img:1
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    env:
      TG_BRANCH: '${{ github.event.repository.default_branch }}'
    outputs:
      report_0: '${{ steps.check.outputs.report_0 }}'
      finding: '${{ steps.check.outputs.finding }}'
    steps:
      - name: Check out the change
        shell: bash
        env:
          TG_TOKEN: '${{ github.token }}'
        run: |
          set -eu
          git config --global --add safe.directory "$PWD" 2>/dev/null || true
          [ -d .git ] || git init -q .
          git remote get-url origin >/dev/null 2>&1 || git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [ -n "${TG_TOKEN:-}" ]; then
            chant_auth="$(printf 'x-access-token:%s' "$TG_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $chant_auth"
            unset chant_auth
          fi
          ref="${TG_REF:-$GITHUB_REF}"
          want="${TG_REF:-$GITHUB_SHA}"
          case "$ref" in
            refs/heads/*) target="refs/remotes/origin/${ref#refs/heads/}" ;;
            refs/tags/*) target="$ref" ;;
            refs/*) target="refs/remotes/${ref#refs/}" ;;
            *) target="refs/remotes/origin/terragucci-head" ;;
          esac
          if git rev-parse -q --verify HEAD >/dev/null; then git clean -ffdxq; fi
          git -c protocol.version=2 fetch -q --no-tags --prune --no-recurse-submodules --depth=1 origin "+$want:$target"
          case "$ref" in
            refs/heads/*) git checkout -q --force -B "${ref#refs/heads/}" "$target" ;;
            *) git checkout -q --force --detach "$target" ;;
          esac
      - id: check
        name: Format check and validate, every root
        run: |
          if [ -z "${CHANT_NO_FORGE_TOKEN:-}" ] && [ "${0#*/}" != "$0" ] && [ -f "$0" ] && ! { [ "${0##*/}" = sh ] || [ "${0##*/}" = bash ] || [ "${0##*/}" = dash ]; } && command -v env >/dev/null 2>&1 && command -v sh >/dev/null 2>&1; then exec env -u CHANT_FORGE_TOKEN -u CHANT_GITHUB_TOKEN -u CHANT_FORGEJO_TOKEN -u CHANT_GITLAB_TOKEN -u CHANT_CHECKOUT_TOKEN -u GITHUB_TOKEN -u GH_TOKEN -u FORGEJO_TOKEN -u GITEA_TOKEN -u GITLAB_TOKEN -u CI_JOB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u TG_TOKEN -u TG_MERGE_TOKEN CHANT_NO_FORGE_TOKEN=1 sh -e "$0"; fi; unset CHANT_FORGE_TOKEN CHANT_GITHUB_TOKEN CHANT_FORGEJO_TOKEN CHANT_GITLAB_TOKEN CHANT_CHECKOUT_TOKEN GITHUB_TOKEN GH_TOKEN FORGEJO_TOKEN GITEA_TOKEN GITLAB_TOKEN CI_JOB_TOKEN ACTIONS_RUNTIME_TOKEN TG_TOKEN TG_MERGE_TOKEN
          chant_report="$PWD/terragucci-check"
          chant_handover() { node -e 'const fs=require("fs"),p=require("path"),z=require("zlib");const [dir,out]=process.argv.slice(1);const CHUNK=450000,PARTS=1,NOTE=["report.md"];const all={};const walk=(d,r)=>{let n=[];try{n=fs.readdirSync(d).sort()}catch{return}for(const x of n){const f=p.join(d,x),k=r?r+"/"+x:x;let s;try{s=fs.lstatSync(f)}catch{continue}if(s.isDirectory())walk(f,k);else if(s.isFile())all[k]=fs.readFileSync(f).toString("base64")}};walk(dir,"");const pack=(o)=>z.gzipSync(JSON.stringify(o)).toString("base64");let b=pack(all);if(b.length>CHUNK*PARTS){b=pack(Object.fromEntries(Object.entries(all).filter(([k])=>NOTE.includes(k))));if(b.length>CHUNK*PARTS){b=pack({});console.error("terragucci: the report is too large to hand to the next job, even cut to report.md; it hands on none of it")}else console.error("terragucci: the report is too large to hand to the next job whole; it hands on report.md")}let o="";for(let i=0;i*CHUNK<b.length;i++)o+="report_"+i+"="+b.slice(i*CHUNK,(i+1)*CHUNK)+"\n";fs.appendFileSync(out,o);' "$chant_report" "${GITHUB_OUTPUT:-/dev/null}" || echo "terragucci: the report could not be handed to the next job" >&2; }
          trap chant_handover EXIT
          set +e
          (
          set -eu
          tofu fmt -check -recursive -diff . || exit 3
          failed=0
          tg_check() {
            dir="$1"
            tg_init tofu -chdir="$dir" init -backend=false -input=false -no-color >/dev/null || return 1
            terragucci check-root "$dir" --binary tofu
          }
          tg_init() {
            if [ -n "${TF_PLUGIN_CACHE_DIR:-}" ]; then until mkdir "$tgtmp/init.lock" 2>/dev/null; do sleep 1; done; fi
            "$@"; rc=$?
            if [ -n "${TF_PLUGIN_CACHE_DIR:-}" ]; then rmdir "$tgtmp/init.lock"; fi
            return $rc
          }
          tgtmp="$(mktemp -d)"
          n=0
          for dir in 'app' 'cache' 'network'; do
            n=$((n+1))
            { export TERRAGUCCI_CHECK_PART="$tgtmp/$n.md"; if tg_check "$dir"; then echo 0 >"$tgtmp/$n.rc"; else echo 1 >"$tgtmp/$n.rc"; fi; } >"$tgtmp/$n.out" 2>&1 &
            eval "tgpid$n=$!"
          done
          wait
          n=0
          for dir in 'app' 'cache' 'network'; do
            n=$((n+1))
            cat "$tgtmp/$n.out"
            if [ -s "$tgtmp/$n.md" ]; then
              mkdir -p terragucci-check; cat "$tgtmp/$n.md" >>terragucci-check/report.md
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$tgtmp/$n.md" >>"$GITHUB_STEP_SUMMARY"; fi
            fi
            [ "$(cat "$tgtmp/$n.rc" 2>/dev/null)" = 0 ] || failed=1
          done
          terragucci check-policy || failed=1
          exit "$failed"
          )
          code=$?
          if [ "$code" -eq 3 ]; then echo "finding=true" >>"$GITHUB_OUTPUT"; fi
          exit "$code"
  check-report:
    runs-on:
      - self-hosted
      - linux
    container:
      image: img:1
    needs: check
    if: always() && (needs.check.result == 'success' || needs.check.result == 'failure')
    steps:
      - name: Take the check report from the check job
        shell: bash
        run: |
          set -u
          node -e 'const fs=require("fs"),p=require("path"),z=require("zlib");const dir=process.argv[1];let b="";for(const l of fs.readFileSync(0,"utf8").split("\n")){if(!l.trim())continue;let s="";try{s=JSON.parse(l)}catch{}if(typeof s==="string")b+=s}if(!b){console.log("chant: the check job handed on no report");process.exit(0)}let files;try{files=JSON.parse(z.gunzipSync(Buffer.from(b,"base64"),{maxOutputLength:268435456}).toString("utf8"))}catch(e){console.log("chant: the report the check job handed on does not read: "+e.message);process.exit(0)}if(!files||typeof files!=="object"||Array.isArray(files)){console.log("chant: the report the check job handed on is not a set of files");process.exit(0)}let n=0;for(const [k,v] of Object.entries(files)){const parts=k.split("/");if(typeof v!=="string"||k.length>1024||parts.some((x)=>!x||x==="."||x===".."||/[\\\x00-\x1f]/.test(x))){console.log("chant: left out "+JSON.stringify(k));continue}try{const f=p.join(dir,...parts);fs.mkdirSync(p.dirname(f),{recursive:true});fs.writeFileSync(f,Buffer.from(v,"base64"));n++}catch(e){console.log("chant: could not write "+JSON.stringify(k)+": "+e.message)}}console.log("chant: took "+n+" report files from the check job")' terragucci-check <<'END_OF_REPORT'
          ${{ toJSON(needs.check.outputs.report_0) }}
          END_OF_REPORT
      - name: Keep the check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terragucci-check
          path: terragucci-check/
          if-no-files-found: ignore
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: plan-runner
    container:
      image: img:1
    permissions:
      contents: read
      statuses: write
    env:
      TF_VAR_db_password: '${{ secrets.TF_VAR_db_password }}'
      TF_VAR_region: '${{ vars.TF_VAR_region }}'
      TG_SHA: '${{ github.event.pull_request.head.sha }}'
      TG_PR: '${{ github.event.pull_request.number }}'
    outputs:
      report_0: '${{ steps.plan.outputs.report_0 }}'
    steps:
      - name: Say on the head that the plan started
        env:
          CHANT_PENDING_TOKEN: '${{ github.token }}'
          CHANT_PENDING_SHA: '${{ github.event.pull_request.head.sha }}'
          CHANT_PENDING_CONTEXT: terragucci/plan
          CHANT_PENDING_DESCRIPTION: planning
        run: '(cd / && node -e ''const api=String(process.env.GITHUB_API_URL||"").replace(/\/+$/,""),repo=process.env.GITHUB_REPOSITORY,sha=process.env.CHANT_PENDING_SHA||"";if(!/^[0-9a-f]{40}$/.test(sha)){console.log("chant: no commit to say the plan started on");process.exit(0)}const run=process.env.GITHUB_SERVER_URL&&process.env.GITHUB_RUN_ID?process.env.GITHUB_SERVER_URL+"/"+repo+"/actions/runs/"+process.env.GITHUB_RUN_ID:undefined;fetch(api+"/repos/"+repo+"/statuses/"+sha,{method:"POST",headers:{authorization:"token "+process.env.CHANT_PENDING_TOKEN,accept:"application/json","content-type":"application/json"},body:JSON.stringify({state:"pending",context:process.env.CHANT_PENDING_CONTEXT,description:process.env.CHANT_PENDING_DESCRIPTION,...(run?{target_url:run}:{})})}).then((r)=>console.log(r.ok?"chant: "+process.env.CHANT_PENDING_CONTEXT+" is pending":"chant: the forge answered "+r.status+" to the pending status"),(err)=>console.log("chant: the pending status was not posted: "+err.message));'')'
      - name: Check out the change
        env:
          CHANT_CHECKOUT_TOKEN: '${{ github.token }}'
        run: |
          set -eu
          git config --global --add safe.directory "$PWD" 2>/dev/null || true
          [ -d .git ] || git init -q .
          git remote get-url origin >/dev/null 2>&1 || git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if [ -n "${CHANT_CHECKOUT_TOKEN:-}" ]; then
            chant_auth="$(printf 'x-access-token:%s' "$CHANT_CHECKOUT_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $chant_auth"
            unset chant_auth
          fi
          ref="$GITHUB_REF"
          want="$GITHUB_SHA"
          case "$ref" in
            refs/heads/*) target="refs/remotes/origin/${ref#refs/heads/}" ;;
            refs/tags/*) target="$ref" ;;
            refs/*) target="refs/remotes/${ref#refs/}" ;;
