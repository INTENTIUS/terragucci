            *) tg status terragucci/apply failure "an apply failed"; terragucci respond apply-failed --log "$log" || true; exit 1 ;;
          esac
          echo "wave 2 of 2, group dev, applied"
      - name: Keep the apply report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terragucci-report-apply-wave-2-dev
          path: terragucci-report/
          if-no-files-found: ignore
  apply-done:
    runs-on: ubuntu-latest
    container:
      image: img:1
    needs:
      - apply-wave-2-prod
      - apply-wave-2-dev
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      statuses: write
    env:
      TG_TOKEN: '${{ github.token }}'
      TG_SHA: '${{ github.sha }}'
    steps:
      - name: Say every wave applied
        shell: bash
        run: |
          set +e -uo pipefail
          export TG_FORGE=github
          tg() { case "$1" in status|note|reply|stale) terragucci post "$@" ;; *) node --input-type=module -e 'import { writeFileSync } from "node:fs";
          const [cmd, ...a] = process.argv.slice(1);
          const e = process.env, gl = e.TG_FORGE === "gitlab", tok = e.TG_TOKEN;
          try {
            if (cmd === "oidc") {
              const r = await fetch(e.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=" + encodeURIComponent(a[1]), { headers: { authorization: "bearer " + e.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
              if (!r.ok) throw new Error("the OIDC token request answered " + r.status + "; the job needs permission to request an OIDC token");
              writeFileSync(a[0], (await r.json()).value, { mode: 0o600 });
            } else if (!tok) {
              console.log("terragucci: no forge token, so no " + cmd);
            } else if (cmd === "alive") {
              const api = gl ? e.CI_API_V4_URL : e.GITHUB_API_URL || e.GITHUB_SERVER_URL + "/api/v1";
              const repo = gl ? "projects/" + e.CI_PROJECT_ID : "repos/" + e.GITHUB_REPOSITORY;
              const r = await fetch(api + "/" + repo + "/actions/runs/" + a[0], { headers: { "content-type": "application/json", ...(gl ? { "private-token": tok } : { authorization: "token " + tok }) } });
              if (!r.ok) throw new Error("GET run " + a[0] + " answered " + r.status);
              const run = await r.json();
              console.log(["success", "failure", "cancelled", "skipped", "completed"].includes(run.status) ? "dead" : "alive");
            }
          } catch (err) {
            console.log("terragucci: " + cmd + " failed: " + err.message);
            if (cmd === "oidc") process.exit(1);
          }' -- "$@" ;; esac; }
          tg status terragucci/apply success "5 roots in 2 groups applied"
          echo "all roots applied"
  tips:
    runs-on: ubuntu-latest
    container:
      image: img:1
    needs: apply-done
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: terragucci-tips-${{ github.repository }}
      cancel-in-progress: false
    env:
      TG_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open a pull request for each tip
        shell: bash
        run: |
          set -u
          export GITHUB_TOKEN="$TG_TOKEN"
          terragucci respond tips --mode apply --binary tofu || true
