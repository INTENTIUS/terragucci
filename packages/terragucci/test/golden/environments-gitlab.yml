    - apply-wave-1-default
  script:
    - terragucci run wave --op tf-apply --wave 1 --of 2 --apply-status terragucci/apply --at "$CI_COMMIT_SHA" --forge gitlab
  allow_failure: true

apply-done:
  stage: apply
  image: img:1
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: (($CI_PIPELINE_SOURCE != "schedule" || $TERRAGUCCI_SCHEDULE == "resume") && $CHANT_PLAN_NOTES == null) && ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
      when: always
  needs:
    - apply-wave-2
    - apply-wave-2-prod
    - apply-wave-2-dev
  script:
    - terragucci run wave --op tf-apply --wave 2 --of 2 --apply-status terragucci/apply --at "$CI_COMMIT_SHA" --forge gitlab
  allow_failure: true

stale-notes:
  stage: apply
  image: img:1
  variables:
    TIP_SHA: '$CI_COMMIT_SHA'
  rules:
    - if: (($CI_PIPELINE_SOURCE != "schedule" || $TERRAGUCCI_SCHEDULE == "resume") && $CHANT_PLAN_NOTES == null) && ($CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)
  script:
    - npx --no-install terragucci components pr-post --stale --tip "$TIP_SHA" --env default --forge gitlab --context terragucci/plan
  allow_failure: true

tips:
  stage: tips
  image:
    name: img:1
  needs:
    - apply-done
  variables:
    TF_IN_AUTOMATION: '1'
    TF_INPUT: '0'
    TG_TOKEN: '$GITLAB_TOKEN'
    TG_SHA: '$CI_COMMIT_SHA'
    TG_BRANCH: '$CI_DEFAULT_BRANCH'
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule" && $CHANT_PLAN_NOTES == null'
  resource_group: terragucci-tips
  script:
    - |
      bash <<'TIPS' || exit $?
      set -u
      export GITLAB_TOKEN="$TG_TOKEN"
      git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${TG_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"
      terragucci respond tips --mode apply --binary tofu || true
      TIPS
