plan-note:
  stage: plan
  image:
    name: img:1
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|api|trigger)$/ && $CHANT_PLAN_NOTES == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    CHANT_PLAN_NOTE_WORDS: '{"footer":"<sub><img src=\"https://intentius.io/terragucci/brand/taco-small.png\" width=\"26\" height=\"16\" alt=\"\"> Posted by [terragucci](https://intentius.io/terragucci/)</sub>","artifact":"terragucci-report","noReport":"Planned in [this run]({run}), which keeps no report artifact; with `reports` set, the note links the report in the bucket.","marker":"terragucci:waves","anchors":{"member":"root-{id}","group":"group-{id}"},"overrideKey":"policy.override","approvalRulesKey":"approval_rules","applyStage":"tf-apply","productMarker":"terragucci:plan"}'
  script:
    - npx --no-install terragucci components pr-post --open --env default --output terragucci-report --forge gitlab --context terragucci/plan

