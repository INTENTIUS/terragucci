# Generated by terragucci.
# terragucci writes this file from terragucci.yml, or from its defaults when
# the repo has none. Change terragucci.yml and run `npx terragucci init`
# rather than editing it here.
# Every job runs in img:1; init pins its digest once the image is published.
stages:
  - build
  - test
  - check
  - plan
  - apply
  - tips
  - deploy

check:
  stage: check
  image:
    name: img:1
  variables:
    TF_IN_AUTOMATION: '1'
    TF_INPUT: '0'
    TG_BRANCH: '$CI_DEFAULT_BRANCH'
  script:
    - |
      unset TG_TOKEN TG_MERGE_TOKEN CHANT_FORGE_TOKEN CHANT_GITHUB_TOKEN CHANT_FORGEJO_TOKEN CHANT_GITLAB_TOKEN CHANT_CHECKOUT_TOKEN GITHUB_TOKEN GH_TOKEN FORGEJO_TOKEN GITEA_TOKEN GITLAB_TOKEN CI_JOB_TOKEN ACTIONS_RUNTIME_TOKEN
      mkdir -p .chant/commit
      set +e
      (
      set -eu
      tofu fmt -check -recursive -diff . || exit 3
      failed=0
      tg_check() {
        dir="$1"
        tg_init tofu -chdir="$dir" init -backend=false -input=false -no-color >/dev/null || return 1
        terragucci check-root "$dir" --binary tofu
      }
      tg_init() {
        if [ -n "${TF_PLUGIN_CACHE_DIR:-}" ]; then until mkdir "$tgtmp/init.lock" 2>/dev/null; do sleep 1; done; fi
        "$@"; rc=$?
        if [ -n "${TF_PLUGIN_CACHE_DIR:-}" ]; then rmdir "$tgtmp/init.lock"; fi
        return $rc
      }
      tgtmp="$(mktemp -d)"
      n=0
      for dir in 'envs/dev/app' 'envs/dev/network' 'envs/prod/app' 'envs/prod/network' 'shared/dns'; do
        n=$((n+1))
        { export TERRAGUCCI_CHECK_PART="$tgtmp/$n.md"; if tg_check "$dir"; then echo 0 >"$tgtmp/$n.rc"; else echo 1 >"$tgtmp/$n.rc"; fi; } >"$tgtmp/$n.out" 2>&1 &
        eval "tgpid$n=$!"
      done
      wait
      n=0
      for dir in 'envs/dev/app' 'envs/dev/network' 'envs/prod/app' 'envs/prod/network' 'shared/dns'; do
        n=$((n+1))
        cat "$tgtmp/$n.out"
        if [ -s "$tgtmp/$n.md" ]; then
          mkdir -p terragucci-check; cat "$tgtmp/$n.md" >>terragucci-check/report.md
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$tgtmp/$n.md" >>"$GITHUB_STEP_SUMMARY"; fi
        fi
        [ "$(cat "$tgtmp/$n.rc" 2>/dev/null)" = 0 ] || failed=1
      done
      terragucci check-policy || failed=1
      exit "$failed"
      )
      code=$?
      if [ "$code" -eq 3 ]; then echo "CHANT_COMMIT_FINDING=1" >.chant/commit/finding.env; else echo "CHANT_COMMIT_FINDING=0" >.chant/commit/finding.env; fi
      exit "$code"
  artifacts:
    name: terragucci-check
    when: always
    paths:
      - terragucci-check/
      - .chant/commit/finding.env
    reports:
      dotenv: .chant/commit/finding.env

fmt:
  stage: check
  image:
    name: img:1
  resource_group: fmt
  timeout: '25 minutes'
  variables:
    CHANT_COMMIT_NAME: terragucci-fmt
    CHANT_COMMIT_ON: check
    CHANT_COMMIT_COMMAND: '["terragucci","fmt","--binary","tofu"]'
    CHANT_COMMIT_ALLOWED: '[]'
    CHANT_COMMIT_ALLOWED_FILES: '["*.tf","*.tofu","*.tfvars","*.hcl"]'
    CHANT_COMMIT_FINDINGS: '3'
    CHANT_COMMIT_MAX_RUNS: '3'
    CHANT_COMMIT_TIMEOUT: '10'
    CHANT_COMMIT_ENV: local
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
      when: always
  needs:
    - job: check
      artifacts: true
  script:
    - if [ "${CHANT_COMMIT_FINDING:-0}" != "1" ]; then echo "the check found nothing, so terragucci-fmt does not run"; exit 0; fi
    - |
      case "$CI_COMMIT_SHA" in *[!0-9a-f]*|'') echo "no pushed commit" >&2; exit 1 ;; esac
      git -c protocol.version=2 fetch -q --no-tags origin "+$CI_COMMIT_SHA:refs/chant/commit-head"
    - git fetch -q --no-tags origin '+refs/heads/chant/lifecycle:refs/heads/chant/lifecycle' 2>/dev/null || true
    - git remote set-url origin "$CI_SERVER_URL/$CI_PROJECT_PATH.git"
    - unset CHANT_FORGE_TOKEN CHANT_GITHUB_TOKEN CHANT_FORGEJO_TOKEN CHANT_GITLAB_TOKEN CHANT_CHECKOUT_TOKEN GITHUB_TOKEN GH_TOKEN FORGEJO_TOKEN GITEA_TOKEN GITLAB_TOKEN CI_JOB_TOKEN ACTIONS_RUNTIME_TOKEN
    - npx --no-install terragucci commit prepare --forge gitlab --output .chant/commit
    - npx --no-install terragucci commit run --forge gitlab --output .chant/commit
  artifacts:
    when: always
    paths:
      - .chant/commit
    expire_in: '7 days'

fmt-push:
  stage: check
  image:
    name: img:1
  resource_group: fmt-push
  variables:
    CHANT_COMMIT_NAME: terragucci-fmt
    CHANT_COMMIT_ON: check
    CHANT_COMMIT_COMMAND: '["terragucci","fmt","--binary","tofu"]'
    CHANT_COMMIT_ALLOWED: '[]'
    CHANT_COMMIT_ALLOWED_FILES: '["*.tf","*.tofu","*.tfvars","*.hcl"]'
    CHANT_COMMIT_FINDINGS: '3'
    CHANT_COMMIT_MAX_RUNS: '3'
    CHANT_COMMIT_TIMEOUT: '10'
    CHANT_COMMIT_ENV: local
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
      when: always
  needs:
    - job: fmt
      artifacts: true
  script:
    - if [ ! -f .chant/commit/decision.json ]; then echo "terragucci-fmt did not run"; exit 0; fi
    - |
      case "$CI_COMMIT_SHA" in *[!0-9a-f]*|'') echo "no pushed commit" >&2; exit 1 ;; esac
      git -c protocol.version=2 fetch -q --no-tags origin "+$CI_COMMIT_SHA:refs/chant/commit-head"
    - git fetch -q --no-tags origin '+refs/heads/chant/lifecycle:refs/heads/chant/lifecycle' 2>/dev/null || true
    - git remote set-url origin "$CI_SERVER_URL/$CI_PROJECT_PATH.git"
    - export CHANT_GITLAB_TOKEN="$GITLAB_TOKEN"
    - chant_auth="$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 | tr -d '\n')"
    - 'export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $chant_auth"'
    - unset chant_auth
    - npx --no-install terragucci commit land --forge gitlab --output .chant/commit

plan:
  stage: plan
  image:
    name: img:1
  variables:
    TF_IN_AUTOMATION: '1'
    TF_INPUT: '0'
    TG_TOKEN: '$GITLAB_TOKEN'
    TG_SHA: '$CI_COMMIT_SHA'
    TG_BRANCH: '$CI_DEFAULT_BRANCH'
    TG_PR: '$CI_MERGE_REQUEST_IID'
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == $CI_PROJECT_PATH'
  id_tokens:
    CHANT_ID_TOKEN_AWS:
      aud: sts.amazonaws.com
  script:
    - |
      bash <<'PLAN' || exit $?
      set +e -uo pipefail
      export TG_FORGE=gitlab
      tg() { case "$1" in status|note|reply|stale) terragucci post "$@" ;; *) node --input-type=module -e 'const [cmd, ...a] = process.argv.slice(1);
      const e = process.env, gl = e.TG_FORGE === "gitlab", tok = e.TG_TOKEN;
      try {
        if (!tok) {
          console.log("terragucci: no forge token, so no " + cmd);
        } else if (cmd === "alive") {
          const api = gl ? e.CI_API_V4_URL : e.GITHUB_API_URL || e.GITHUB_SERVER_URL + "/api/v1";
          const repo = gl ? "projects/" + e.CI_PROJECT_ID : "repos/" + e.GITHUB_REPOSITORY;
          const r = await fetch(api + "/" + repo + "/pipelines/" + a[0], { headers: { "content-type": "application/json", ...(gl ? { "private-token": tok } : { authorization: "token " + tok }) } });
          if (!r.ok) throw new Error("GET run " + a[0] + " answered " + r.status);
          const run = await r.json();
          console.log(["success", "failed", "canceled", "skipped"].includes(run.status) ? "dead" : "alive");
        }
      } catch (err) {
        console.log("terragucci: " + cmd + " failed: " + err.message);
      }' -- "$@" ;; esac; }
      export CHANT_CLOUD_LOGIN='{"aws":{"role":"arn:aws:iam::333333333333:role/plan","targets":[{"targets":["envs/prod/**"],"role":"arn:aws:iam::222222222222:role/prod-plan"},{"targets":["envs/dev/**"],"role":"arn:aws:iam::111111111111:role/dev-plan"}],"audience":"sts.amazonaws.com","sessionName":"terragucci-plan"}}'
      CHANT_CLOUD_LOGIN_VARS="$(cd / && node -e 'const fs=require("fs"),crypto=require("crypto");const [out,format,forge]=process.argv.slice(1);const Q=String.fromCharCode(39);const fail=(m)=>{console.error("chant: the cloud login failed: "+m);process.exit(1)};let spec;try{spec=JSON.parse(process.env.CHANT_CLOUD_LOGIN||"")}catch{fail("CHANT_CLOUD_LOGIN is not JSON")}const clean=(v)=>typeof v==="string"&&/^[\x21-\x7e]+$/.test(v);const trim=(u)=>String(u).replace(/\/+$/,"");const tmp=trim(process.env.RUNNER_TEMP||process.env.TMPDIR||"/tmp");const rand=()=>crypto.randomBytes(8).toString("hex");const NO={github:"it needs permissions: id-token: write, and a pull request from a fork gets none",forgejo:"Forgejo serves one from version 15, with Forgejo Runner 12.5 or later, to a job with enable-openid-connect: true; on an older Forgejo give the cloud a tokenFile the runner provides"};const mine=[];const tokenFile=async(cloud,s)=>{if(s.tokenFile){const f=s.tokenFile.replace(/^\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?/,(m,v)=>process.env[v]||"");let t;try{t=fs.readFileSync(f,"utf8").trim()}catch{throw new Error(cloud+"\u0027s tokenFile "+f+" cannot be read")}if(!t)throw new Error(cloud+"\u0027s tokenFile "+f+" is empty");return f}const name="CHANT_ID_TOKEN_"+cloud.toUpperCase();let v=process.env[name];if(!v){if(forge==="gitlab")throw new Error("the job has no "+name+": it needs id_tokens: "+name+": aud: "+s.audience);const u=process.env.ACTIONS_ID_TOKEN_REQUEST_URL,k=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;if(!u||!k)throw new Error("the job can request no OIDC token for "+cloud+": "+(NO[forge]||NO.github));const r=await fetch(u+(u.includes("?")?"&":"?")+"audience="+encodeURIComponent(s.audience),{headers:{authorization:"bearer "+k,accept:"application/json"}});if(!r.ok)throw new Error("the OIDC token request answered "+r.status);try{v=JSON.parse(await r.text()).value}catch{throw new Error("the OIDC token request answered with no JSON")}}if(!clean(v))throw new Error("the job\u0027s OIDC token for "+cloud+" is not a token");const f=tmp+"/chant-oidc-"+cloud+"-"+rand();fs.writeFileSync(f,v,{mode:0o600,flag:"wx"});mine.push(f);return f};const KEY={"aws":"role","gcp":"serviceAccount","azure":"clientId","pulumi":"token"};const ids=(c)=>{const s=spec[c],l=[];if(s[KEY[c]])l.push(s[KEY[c]]);for(const t of s.targets||[])if(!l.includes(t[KEY[c]]))l.push(t[KEY[c]]);return l};const vars={},said=[],by={};const run=async()=>{if(spec.aws){const a=spec.aws;const f=await tokenFile("aws",a);by.aws={};const base={AWS_WEB_IDENTITY_TOKEN_FILE:f,AWS_ROLE_SESSION_NAME:a.sessionName||"chant",...(a.region?{AWS_REGION:a.region,AWS_DEFAULT_REGION:a.region}:{}),...(a.endpoint?{AWS_ENDPOINT_URL_STS:trim(a.endpoint)}:{})};for(const role of ids("aws")){by.aws[role]={AWS_ROLE_ARN:role,...base};said.push(role)}if(a.role)Object.assign(vars,by.aws[a.role]);else{Object.assign(vars,base);console.error("chant: wrote the aws OIDC token file, with no role of the job\u0027s own")}}if(spec.gcp){const c=spec.gcp;const f=await tokenFile("gcp",c);by.gcp={};const sts=trim(c.stsEndpoint||"https://sts.googleapis.com"),iam=trim(c.iamEndpoint||"https://iamcredentials.googleapis.com");const tu=/\/token$/.test(sts)?sts:sts+"/v1/token";for(const sa of ids("gcp")){const cf=tmp+"/chant-gcp-"+rand()+".json";fs.writeFileSync(cf,JSON.stringify({type:"external_account",audience:"//iam.googleapis.com/"+c.provider,subject_token_type:"urn:ietf:params:oauth:token-type:jwt",token_url:tu,service_account_impersonation_url:iam+"/v1/projects/-/serviceAccounts/"+sa+":generateAccessToken",credential_source:{file:f}})+"\n",{mode:0o600,flag:"wx"});by.gcp[sa]={GOOGLE_APPLICATION_CREDENTIALS:cf,CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:cf};said.push(sa)}if(c.serviceAccount)Object.assign(vars,by.gcp[c.serviceAccount])}if(spec.azure){const z=spec.azure;const f=await tokenFile("azure",z);by.azure={};for(const cid of ids("azure")){by.azure[cid]={AZURE_CLIENT_ID:cid,AZURE_TENANT_ID:z.tenantId,AZURE_FEDERATED_TOKEN_FILE:f,ARM_USE_OIDC:"true",ARM_CLIENT_ID:cid,ARM_TENANT_ID:z.tenantId,ARM_OIDC_TOKEN_FILE_PATH:f,...(z.subscriptionId?{AZURE_SUBSCRIPTION_ID:z.subscriptionId,ARM_SUBSCRIPTION_ID:z.subscriptionId}:{}),...(z.authority?{AZURE_AUTHORITY_HOST:trim(z.authority)}:{})};said.push(cid)}if(z.clientId)Object.assign(vars,by.azure[z.clientId]);if(z.cli){const r=require("child_process").spawnSync("az",["login","--service-principal","--username",z.clientId,"--tenant",z.tenantId,"--federated-token",fs.readFileSync(f,"utf8").trim(),"--allow-no-subscriptions","--output","none"],{stdio:["ignore","ignore","inherit"]});if(r.error)throw new Error("az login could not run: "+r.error.message);if(r.status!==0)throw new Error("az login exited "+r.status);if(z.subscriptionId){const s=require("child_process").spawnSync("az",["account","set","--subscription",z.subscriptionId],{stdio:["ignore","ignore","inherit"]});if(s.status!==0)throw new Error("az account set exited "+s.status)}}}const clouds=Object.keys(by);if(clouds.some((c)=>(spec[c].targets||[]).length>0)){const doc={version:1,clouds:{}};for(const c of clouds){const s=spec[c];doc.clouds[c]={...(s[KEY[c]]?{default:s[KEY[c]]}:{}),targets:(s.targets||[]).map((t)=>({targets:t.targets,identity:t[KEY[c]]})),vars:by[c]}}const tf=tmp+"/chant-cloud-targets-"+rand()+".json";fs.writeFileSync(tf,JSON.stringify(doc),{mode:0o600,flag:"wx"});vars.CHANT_CLOUD_TARGETS=tf}if(mine.length)vars.CHANT_CLOUD_TOKEN_FILES=mine.join(":");for(const [k,v] of Object.entries(vars))if(!clean(v))throw new Error(k+" is not a value the job can hold");if(format==="github-env")fs.appendFileSync(out,Object.entries(vars).map(([k,v])=>k+"="+v+"\n").join(""));else process.stdout.write(Object.entries(vars).map(([k,v])=>"export "+k+"="+Q+v.split(Q).join(Q+"\\"+Q+Q)+Q+"\n").join(""));for(const s of said)console.error("chant: logged in from the OIDC token file as "+s)};run().catch((e)=>fail(e&&e.message?e.message:String(e)));' "-" sh gitlab)" || exit 1
      eval "$CHANT_CLOUD_LOGIN_VARS"
      unset CHANT_CLOUD_LOGIN_VARS CHANT_CLOUD_LOGIN CHANT_ID_TOKEN_AWS
      tg status terragucci/plan pending "planning"
      terragucci stage tf-plan --out terragucci-report --binary tofu --layers 'envs/dev/network,envs/prod/network,shared/dns;envs/dev/app,envs/prod/app' --report-url "$CI_JOB_URL/artifacts/file/terragucci-report/report.html"
      rc=$?
      if [ ! -f terragucci-report/report.json ]; then
        tg status terragucci/plan failure "the plan report was not written"
        exit 1
      fi
      counts="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8"));const n=(a)=>r.named.filter((x)=>a.includes(x.action)).length;const f=n(["refused"]);console.log((f?f+" failed: ":"")+r.roots.length+" roots, "+r.groups.length+" groups, "+n(["delete","replace"])+" destroys")' terragucci-report/report.json)"
      if [ -n "${TG_PR:-}" ]; then
        note="$(mktemp)"
        # The first line says which roots the note covers, so an apply can mark it stale.
        { echo "<!-- terragucci:plan roots=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8")).roots.map((x)=>x.path).join(","))' terragucci-report/report.json) -->"; cat terragucci-report/note.md; } >"$note"
        tg note "$note"
      fi
      if [ "$rc" -ne 0 ]; then tg status terragucci/plan failure "$counts"; exit 1; fi
      tg status terragucci/plan success "$counts"
      PLAN
  artifacts:
    name: terragucci-report
    when: always
    paths:
      - terragucci-report/
    reports:
      terraform: terragucci-report/gitlab-terraform.json

