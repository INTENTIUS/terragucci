      hold_prefix="refs/tags/terragucci-apply-hold-${CI_PIPELINE_ID}-"
      hold_ref="${hold_prefix}apply-wave-1-prod"
      empty="$(git mktree </dev/null)"
      mine="$(GIT_AUTHOR_NAME=terragucci GIT_AUTHOR_EMAIL=terragucci@localhost GIT_COMMITTER_NAME=terragucci GIT_COMMITTER_EMAIL=terragucci@localhost git commit-tree "$empty" -m "run ${CI_PIPELINE_ID} $(date +%s) apply-wave-1-prod")"
