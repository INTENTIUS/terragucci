# Generated by terragucci.
# terragucci writes this file from terragucci.yml, or from its defaults when
# the repo has none. Change terragucci.yml and run `npx terragucci init`
# rather than editing it here.
# Every job runs in img:1; init pins its digest once the image is published.
stages:
  - build
  - test
  - check
  - plan
  - apply
  - tips
  - deploy

check:
  stage: check
  image:
    name: img:1
  variables:
    TF_IN_AUTOMATION: '1'
    TF_INPUT: '0'
    TG_BRANCH: '$CI_DEFAULT_BRANCH'
  script:
    - |
      unset TG_TOKEN TG_MERGE_TOKEN GITLAB_TOKEN CI_JOB_TOKEN
      set -eu
      tofu fmt -check -recursive -diff .
      failed=0
      for dir in 'envs/dev/app' 'envs/dev/network' 'envs/prod/app' 'envs/prod/network' 'shared/dns'; do
        tofu -chdir="$dir" init -backend=false -input=false -no-color >/dev/null
        terragucci check-root "$dir" --binary tofu || failed=1
      done
      terragucci check-policy || failed=1
      exit "$failed"
  artifacts:
    name: terragucci-check
    when: always
    paths:
      - terragucci-check/

fmt:
  stage: check
  image:
    name: img:1
  needs:
    - check
  variables:
    TF_IN_AUTOMATION: '1'
    TF_INPUT: '0'
    TG_TOKEN: '$GITLAB_TOKEN'
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
      when: on_failure
  script:
    - |
      bash <<'FMT' || exit $?
      set -u
      export GITLAB_TOKEN="$TG_TOKEN"
      git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${TG_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"
      terragucci respond fmt --mode apply --binary tofu --branch "$CI_COMMIT_BRANCH" || true
      FMT

plan:
  stage: plan
  image:
    name: img:1
  variables:
    TF_IN_AUTOMATION: '1'
    TF_INPUT: '0'
    TG_TOKEN: '$GITLAB_TOKEN'
    TG_SHA: '$CI_COMMIT_SHA'
    TG_BRANCH: '$CI_DEFAULT_BRANCH'
    TG_PR: '$CI_MERGE_REQUEST_IID'
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == $CI_PROJECT_PATH'
  id_tokens:
    TERRAGUCCI_OIDC:
      aud: sts.amazonaws.com
  script:
    - |
      bash <<'PLAN' || exit $?
      set +e -uo pipefail
      export TG_FORGE=gitlab
      tg() { case "$1" in status|note|reply|stale) terragucci post "$@" ;; *) node --input-type=module -e 'import { writeFileSync } from "node:fs";
      const [cmd, ...a] = process.argv.slice(1);
      const e = process.env, gl = e.TG_FORGE === "gitlab", tok = e.TG_TOKEN;
      try {
        if (cmd === "oidc") {
          const r = await fetch(e.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=" + encodeURIComponent(a[1]), { headers: { authorization: "bearer " + e.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
          if (!r.ok) throw new Error("the OIDC token request answered " + r.status + "; the job needs permission to request an OIDC token");
          writeFileSync(a[0], (await r.json()).value, { mode: 0o600 });
        } else if (!tok) {
          console.log("terragucci: no forge token, so no " + cmd);
        } else if (cmd === "alive") {
          const api = gl ? e.CI_API_V4_URL : e.GITHUB_API_URL || e.GITHUB_SERVER_URL + "/api/v1";
          const repo = gl ? "projects/" + e.CI_PROJECT_ID : "repos/" + e.GITHUB_REPOSITORY;
          const r = await fetch(api + "/" + repo + "/pipelines/" + a[0], { headers: { "content-type": "application/json", ...(gl ? { "private-token": tok } : { authorization: "token " + tok }) } });
          if (!r.ok) throw new Error("GET run " + a[0] + " answered " + r.status);
          const run = await r.json();
          console.log(["success", "failed", "canceled", "skipped"].includes(run.status) ? "dead" : "alive");
        }
      } catch (err) {
        console.log("terragucci: " + cmd + " failed: " + err.message);
        if (cmd === "oidc") process.exit(1);
      }' -- "$@" ;; esac; }
      export AWS_ROLE_ARN='arn:aws:iam::333333333333:role/plan' AWS_ROLE_SESSION_NAME='terragucci-plan'
      export AWS_WEB_IDENTITY_TOKEN_FILE="$(mktemp)"
      printf '%s' "$TERRAGUCCI_OIDC" >"$AWS_WEB_IDENTITY_TOKEN_FILE"
      export TERRAGUCCI_ROOT_ROLES='[["envs/prod/**","arn:aws:iam::222222222222:role/prod-plan"],["envs/dev/**","arn:aws:iam::111111111111:role/dev-plan"]]'
      tg status terragucci/plan pending "planning"
      terragucci stage tf-plan --out terragucci-report --binary tofu --layers 'envs/dev/network,envs/prod/network,shared/dns;envs/dev/app,envs/prod/app' --report-url "$CI_JOB_URL/artifacts/file/terragucci-report/report.html"
      rc=$?
      if [ ! -f terragucci-report/report.json ]; then
        tg status terragucci/plan failure "the plan report was not written"
        exit 1
      fi
      counts="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8"));const n=(a)=>r.named.filter((x)=>a.includes(x.action)).length;const f=n(["refused"]);console.log((f?f+" failed: ":"")+r.roots.length+" roots, "+r.groups.length+" groups, "+n(["delete","replace"])+" destroys")' terragucci-report/report.json)"
      if [ -n "${TG_PR:-}" ]; then
        note="$(mktemp)"
        # The first line says which roots the note covers, so an apply can mark it stale.
        { echo "<!-- terragucci:plan roots=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8")).roots.map((x)=>x.path).join(","))' terragucci-report/report.json) -->"; cat terragucci-report/note.md; } >"$note"
        tg note "$note"
      fi
      if [ "$rc" -ne 0 ]; then tg status terragucci/plan failure "$counts"; exit 1; fi
      tg status terragucci/plan success "$counts"
      PLAN
  artifacts:
    name: terragucci-report
    when: always
    paths:
      - terragucci-report/
    reports:
      terraform: terragucci-report/gitlab-terraform.json

apply-wave-1:
  stage: apply
  image:
    name: img:1
  variables:
    TF_IN_AUTOMATION: '1'
    TF_INPUT: '0'
    TG_TOKEN: '$GITLAB_TOKEN'
    TG_SHA: '$CI_COMMIT_SHA'
    TG_BRANCH: '$CI_DEFAULT_BRANCH'
    TG_BEFORE: '$CI_COMMIT_BEFORE_SHA'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  id_tokens:
    TERRAGUCCI_OIDC:
      aud: sts.amazonaws.com
  script:
    - |
      bash <<'APPLY' || exit $?
      set +e -uo pipefail
      export TG_FORGE=gitlab
      tg() { case "$1" in status|note|reply|stale) terragucci post "$@" ;; *) node --input-type=module -e 'import { writeFileSync } from "node:fs";
      const [cmd, ...a] = process.argv.slice(1);
      const e = process.env, gl = e.TG_FORGE === "gitlab", tok = e.TG_TOKEN;
      try {
        if (cmd === "oidc") {
          const r = await fetch(e.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=" + encodeURIComponent(a[1]), { headers: { authorization: "bearer " + e.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
          if (!r.ok) throw new Error("the OIDC token request answered " + r.status + "; the job needs permission to request an OIDC token");
          writeFileSync(a[0], (await r.json()).value, { mode: 0o600 });
        } else if (!tok) {
          console.log("terragucci: no forge token, so no " + cmd);
        } else if (cmd === "alive") {
          const api = gl ? e.CI_API_V4_URL : e.GITHUB_API_URL || e.GITHUB_SERVER_URL + "/api/v1";
          const repo = gl ? "projects/" + e.CI_PROJECT_ID : "repos/" + e.GITHUB_REPOSITORY;
          const r = await fetch(api + "/" + repo + "/pipelines/" + a[0], { headers: { "content-type": "application/json", ...(gl ? { "private-token": tok } : { authorization: "token " + tok }) } });
          if (!r.ok) throw new Error("GET run " + a[0] + " answered " + r.status);
          const run = await r.json();
          console.log(["success", "failed", "canceled", "skipped"].includes(run.status) ? "dead" : "alive");
        }
      } catch (err) {
        console.log("terragucci: " + cmd + " failed: " + err.message);
        if (cmd === "oidc") process.exit(1);
      }' -- "$@" ;; esac; }
      export AWS_ROLE_ARN='arn:aws:iam::333333333333:role/plan' AWS_ROLE_SESSION_NAME='terragucci-apply'
      export AWS_WEB_IDENTITY_TOKEN_FILE="$(mktemp)"
      printf '%s' "$TERRAGUCCI_OIDC" >"$AWS_WEB_IDENTITY_TOKEN_FILE"
      export TERRAGUCCI_ROOT_ROLES='[["envs/prod/**","arn:aws:iam::222222222222:role/prod-plan"],["envs/dev/**","arn:aws:iam::111111111111:role/dev-plan"]]'
      if [ -n "${TG_BEFORE:-}" ] && [ "${TG_BEFORE#0000000}" = "$TG_BEFORE" ] && git fetch -q --depth=1 origin "$TG_BEFORE" 2>/dev/null; then
        changed="$(git diff --name-only "$TG_BEFORE" HEAD)"
      else
        changed=
      fi
      moved=""
      for dir in 'envs/dev/app' 'envs/dev/network' 'envs/prod/app' 'envs/prod/network' 'shared/dns'; do
        if [ -z "$changed" ] || printf '%s\n' "$changed" | grep "^$dir/" >/dev/null; then moved="${moved:+$moved,}$dir"; fi
      done
      # The base branch moved under these roots: plan notes that cover them are stale.
      tg stale "$moved" "${TG_BRANCH:-}"
      git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${TG_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"
      lock_ref="refs/tags/terragucci-apply-lock"
      hold_prefix="refs/tags/terragucci-apply-hold-${CI_PIPELINE_ID}-"
      hold_ref="${hold_prefix}apply-wave-1"
      empty="$(git mktree </dev/null)"
      mine="$(GIT_AUTHOR_NAME=terragucci GIT_AUTHOR_EMAIL=terragucci@localhost GIT_COMMITTER_NAME=terragucci GIT_COMMITTER_EMAIL=terragucci@localhost git commit-tree "$empty" -m "run ${CI_PIPELINE_ID} $(date +%s) apply-wave-1")"
      git push -q --force origin "$mine:$hold_ref" 2>/dev/null || { echo "could not push $hold_ref, so the apply lock cannot be shared" >&2; exit 1; }
      release_lock() {
        git push -q origin ":$hold_ref" 2>/dev/null || true
        [ -z "$(git ls-remote origin "${hold_prefix}*")" ] || return 0
        held="$(git ls-remote origin "$lock_ref" | cut -f1)"
        { [ -n "$held" ] && git fetch -q origin "+$lock_ref:$lock_ref" 2>/dev/null; } || return 0
        [ "$(git log -1 --format=%s "$lock_ref" | cut -d" " -f2)" = "${CI_PIPELINE_ID}" ] || return 0
        git push -q --force-with-lease="$lock_ref:$held" origin ":$lock_ref" 2>/dev/null || true
      }
      trap release_lock EXIT
      tries=0
      until git push -q origin "$mine:$lock_ref" 2>/dev/null; do
        held="$(git ls-remote origin "$lock_ref" | cut -f1)"
        if [ -n "$held" ] && git fetch -q origin "+$lock_ref:$lock_ref" 2>/dev/null; then
          lease="$(git log -1 --format=%s "$lock_ref")"
          holder="$(echo "$lease" | cut -d" " -f2)"; since="$(echo "$lease" | cut -d" " -f3)"
          if [ "$holder" = "${CI_PIPELINE_ID}" ]; then echo "this run holds the apply lock; apply-wave-1 joins it"; break; fi
          if [ "$(tg alive "$holder")" = dead ] || [ $(( $(date +%s) - ${since:-0} )) -ge "${TG_LOCK_STALE:-7200}" ]; then
            echo "the apply lock was held by run $holder, which is gone; taking it over"
            if git push -q --force-with-lease="$lock_ref:$held" origin "+$mine:$lock_ref" 2>/dev/null; then
              for gone in $(git ls-remote origin "refs/tags/terragucci-apply-hold-$holder-*" | cut -f2); do git push -q origin ":$gone" 2>/dev/null || true; done
              break
            fi
          fi
        fi
        if [ "$tries" -ge 360 ]; then echo "another apply has held $lock_ref for an hour" >&2; exit 1; fi
        sleep "${TG_LOCK_POLL:-10}"; tries=$((tries + 1))
      done
      tip="$([ -z "${GITHUB_REF_NAME:-}" ] || git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" 2>/dev/null | cut -f1)"
      if [ -n "$tip" ] && [ "$tip" != "${GITHUB_SHA:-}" ]; then
        echo "a newer push to ${GITHUB_REF_NAME} applies everything; standing down"
        tg status terragucci/apply success "superseded by a newer push"
        exit 0
      fi
      tg status terragucci/apply pending "applying"
      outcome="$(mktemp)"
      log="$(mktemp)"
      TG_OUTCOME="$outcome" terragucci stage tf-apply --wave 1 --layers 'envs/dev/network,envs/prod/network,shared/dns;envs/dev/app,envs/prod/app' --binary tofu --gate on-destructive --stand-down --groups 'prod=envs/prod/**;dev=envs/dev/**' 2>&1 | tee "$log"
      rc=${PIPESTATUS[0]}
      case "$rc" in
        0) ;;
        3) tg status terragucci/apply failure "$(cat "$outcome")"; exit 3 ;;
        4) tg status terragucci/apply failure "$(cat "$outcome")"; terragucci respond wave-refused --wave 1 --approved terragucci-report/approved --current terragucci-report/current || true; exit 4 ;;
        6) tg status terragucci/apply success "superseded by a newer push"; exit 0 ;;
        *) tg status terragucci/apply failure "an apply failed"; terragucci respond apply-failed --log "$log" || true; exit 1 ;;
      esac
      echo "wave 1 of 2 decided; its groups apply"
      APPLY
  artifacts:
    name: terragucci-report-apply-wave-1
    when: always
    paths:
      - terragucci-report/
      - terragucci-wave/

apply-wave-1-prod:
