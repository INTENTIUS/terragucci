tips:
  stage: tips
  image:
    name: img:1
  needs:
    - apply-wave-2
  variables:
    TF_IN_AUTOMATION: '1'
    TF_INPUT: '0'
    TG_TOKEN: '$GITLAB_TOKEN'
    TG_SHA: '$CI_COMMIT_SHA'
    TG_BRANCH: '$CI_DEFAULT_BRANCH'
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
  resource_group: terragucci-tips
  script:
    - |
      bash <<'TIPS' || exit $?
      set -u
      export GITLAB_TOKEN="$TG_TOKEN"
      git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${TG_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"
      terragucci respond tips --mode apply --binary tofu || true
      TIPS
  tags:
    - docker

publish:
  stage: publish
  image:
    name: img:1
  needs:
    - apply-wave-2
  variables:
    TF_IN_AUTOMATION: '1'
    TF_INPUT: '0'
    TG_TOKEN: '$GITLAB_TOKEN'
    TG_SHA: '$CI_COMMIT_SHA'
    TG_BRANCH: '$CI_DEFAULT_BRANCH'
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"'
  resource_group: terragucci-publish
  script:
    - |
      bash <<'PUBLISH' || exit $?
      set -eu
      git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${TG_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"
      git fetch --quiet --tags origin
      terragucci publish
      PUBLISH
  tags:
    - docker

drift:
  stage: drift
  image:
    name: img:1
  variables:
    TF_IN_AUTOMATION: '1'
    TF_INPUT: '0'
    TG_TOKEN: '$GITLAB_TOKEN'
    TG_SHA: '$CI_COMMIT_SHA'
    TG_BRANCH: '$CI_DEFAULT_BRANCH'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $TERRAGUCCI_SCHEDULE != "comments" && $TERRAGUCCI_SCHEDULE != "resume" && $TERRAGUCCI_SCHEDULE != "ephemeral"'
  script:
    - |
      bash <<'DRIFT' || exit $?
      set +e -uo pipefail
      terragucci stage tf-drift --out terragucci-report --binary tofu --forge gitlab --layers 'network;app,cache' --report-url "$CI_JOB_URL/artifacts/file/terragucci-report/report.html"
      rc=$?
      export GITLAB_TOKEN="$TG_TOKEN"
      git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${TG_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"
      if [ "$rc" -eq 0 ]; then terragucci respond drift --mode apply --binary tofu || true; fi
      exit "$rc"
      DRIFT
  artifacts:
    name: terragucci-report-drift
    when: always
    paths:
      - terragucci-report/
  tags:
    - drift-runner

comments:
  stage: comments
  image:
    name: img:1
  variables:
    TG_TOKEN: '$GITLAB_TOKEN'
    GIT_STRATEGY: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $TERRAGUCCI_SCHEDULE == "comments"'
  resource_group: terragucci-comments
  script:
    - |
      bash <<'COMMENTS' || exit $?
      terragucci comment --forge gitlab --poll --layers 'network;app,cache'
      COMMENTS
  tags:
    - docker

resume:
  stage: resume
  image:
    name: img:1
  variables:
    TG_TOKEN: '$GITLAB_TOKEN'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $TERRAGUCCI_SCHEDULE == "resume"'
  resource_group: terragucci-resume
  script:
    - |
      bash <<'RESUME' || exit $?
      terragucci resume --forge gitlab
      RESUME
  tags:
    - prod
    - docker

ephemeral:
  stage: apply
  image:
    name: img:1
  variables:
    TF_IN_AUTOMATION: '1'
    TF_INPUT: '0'
    TG_TOKEN: '$GITLAB_TOKEN'
    TG_SHA: '$CI_COMMIT_SHA'
    TG_BRANCH: '$CI_DEFAULT_BRANCH'
    TG_PR: '$CI_MERGE_REQUEST_IID'
    GIT_DEPTH: '0'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == $CI_PROJECT_PATH'
  resource_group: terragucci-ephemeral-$CI_MERGE_REQUEST_IID
  script:
    - |
      bash <<'EPHEMERAL' || exit $?
      git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${TG_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"
      git fetch -q origin "+refs/heads/${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
      terragucci ephemeral up --pr "$CI_MERGE_REQUEST_IID" --head "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}" --base "origin/${CI_DEFAULT_BRANCH}" --binary tofu
      EPHEMERAL
  tags:
    - prod
    - docker

ephemeral-sweep:
