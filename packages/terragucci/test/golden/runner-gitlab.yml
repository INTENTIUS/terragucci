  resource_group: terragucci-ephemeral-sweep
  script:
    - |
      bash <<'SWEEP' || exit $?
      git remote set-url origin "${CI_SERVER_PROTOCOL}://oauth2:${TG_TOKEN}@${CI_SERVER_FQDN}/${CI_PROJECT_PATH}.git"
      terragucci ephemeral sweep --binary tofu
      SWEEP
  tags:
    - prod
    - docker
