name: terragucci-request

on:
  workflow_dispatch:
    inputs:
      template:
        description: The template's address, such as acme/bucket/aws
        required: true
        type: string
      version:
        description: The template version; empty for its newest one a request may name
        required: false
        type: string
      name:
        description: 'The app''s name: a lowercase letter, then lowercase letters, digits and -'
        required: true
        type: string
      inputs:
        description: The template's inputs as one JSON object, by name
        required: false
        default: '{}'
        type: string

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

concurrency:
  group: terragucci-request-${{ github.repository }}-${{ github.event.inputs.name }}
  cancel-in-progress: false

jobs:
  request:
    runs-on: docker
    container:
      image: ghcr.io/intentius/terragucci-tofu:0.4.46-tofu1.13.1@sha256:6f663999802c06bebf634e1fc78bfd073bdecb1b9144cb7ddc2f03381f1fe325
    env:
      TG_TOKEN: '${{ github.token }}'
      TG_TEMPLATE: '${{ github.event.inputs.template }}'
      TG_VERSION: '${{ github.event.inputs.version }}'
      TG_NAME: '${{ github.event.inputs.name }}'
      TG_INPUTS: '${{ github.event.inputs.inputs }}'
      TG_REQUESTED_BY: '${{ github.triggering_actor || github.actor }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Open the pull request that adds the app's root from the template
        shell: bash
        run: |
          set -eu
          inputs="$(mktemp)"
          printf '%s' "${TG_INPUTS:-}" > "$inputs"
          [ -s "$inputs" ] || printf '{}' > "$inputs"
          set -- "$TG_TEMPLATE" --name "$TG_NAME" --inputs-file "$inputs" --via form --requested-by "$TG_REQUESTED_BY"
          [ -z "${TG_VERSION:-}" ] || set -- "$@" --version "$TG_VERSION"
          terragucci request "$@"
