        with:
          name: terragucci-report-apply-wave-2-dev-outcome
          path: .chant/op-waves/tf-apply/outcomes/outcome-wave-2-group-dev.json
          if-no-files-found: ignore
      - name: Keep the apply report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: terragucci-report-apply-wave-2-dev
          path: terragucci-report/
          if-no-files-found: ignore
    enable-openid-connect: true
  apply-wave-1-status:
    runs-on: docker
    needs:
      - apply-wave-1
      - apply-wave-1-prod
      - apply-wave-1-dev
      - apply-wave-1-default
    if: '${{ ((github.event_name == ''push'' && (github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch)))) && (!cancelled()) }}'
    container:
      image: img:1
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the waves' outcomes
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          path: .chant/op-waves/tf-apply/outcomes
      - name: Post terragucci/apply after wave 1
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: terragucci run wave --op tf-apply --wave 1 --of 2 --apply-status terragucci/apply --at "$GITHUB_SHA" --forge forgejo
  apply-done:
    runs-on: docker
    needs:
      - apply-wave-2
      - apply-wave-2-prod
      - apply-wave-2-dev
    if: '${{ ((github.event_name == ''push'' && (github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch)))) && (!cancelled()) }}'
    container:
      image: img:1
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the waves' outcomes
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          path: .chant/op-waves/tf-apply/outcomes
      - name: Post terragucci/apply after wave 2
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: terragucci run wave --op tf-apply --wave 2 --of 2 --apply-status terragucci/apply --at "$GITHUB_SHA" --forge forgejo
  stale-notes:
    runs-on: docker
    if: '${{ ((github.event_name == ''push'' && (github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch)))) && (github.event_name == ''push'') }}'
    container:
      image: img:1
    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mark the plan notes this push made stale
        env:
          TIP_SHA: '${{ github.sha }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: npx --no-install terragucci components pr-post --stale --tip "$TIP_SHA" --env default --forge forgejo --context terragucci/plan --preview-comment
  tips:
    runs-on: docker
    container:
      image: img:1
    needs: apply-done
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    concurrency:
      group: terragucci-tips-${{ github.repository }}
      cancel-in-progress: false
    env:
      TG_TOKEN: '${{ github.token }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Open a pull request for each tip
        shell: bash
        run: |
          set -u
          export FORGEJO_TOKEN="$TG_TOKEN"
          terragucci respond tips --mode apply --binary tofu || true
