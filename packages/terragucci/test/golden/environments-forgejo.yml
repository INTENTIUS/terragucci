      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the earlier jobs' outcomes
        uses: https://code.forgejo.org/actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3.0.2
        with:
          path: .chant/op-waves/tf-apply/outcomes
      - name: Plan wave 2 (wave-2) and decide its gate
        env:
          GITHUB_TOKEN: '${{ github.token }}'
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL CHANT_ID_TOKEN_AWS CHANT_ID_TOKEN_GCP CHANT_ID_TOKEN_AZURE CHANT_ID_TOKEN_PULUMI CHANT_CLOUD_TRADE
          terragucci run wave --spec .chant/op-waves/tf-apply.spec.json --wave 2 --render-spec --decide
      - name: Keep wave 2's decision
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: terragucci-wave-2
          path: .chant/op-waves/tf-apply/wave-2.json
          if-no-files-found: ignore
      - name: Keep the job's outcome
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: terragucci-report-apply-wave-2-outcome
          path: .chant/op-waves/tf-apply/outcomes/outcome-wave-2.json
          if-no-files-found: ignore
      - name: Keep the apply report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: terragucci-report-apply-wave-2
          path: terragucci-report/
          if-no-files-found: ignore
