          GITHUB_TOKEN: '${{ github.token }}'
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL CHANT_ID_TOKEN_AWS CHANT_ID_TOKEN_GCP CHANT_ID_TOKEN_AZURE CHANT_ID_TOKEN_PULUMI CHANT_CLOUD_TRADE
          terragucci run wave --spec .chant/op-waves/tf-apply.spec.json --wave 2 --render-spec --group dev
      - name: Keep the job's outcome
