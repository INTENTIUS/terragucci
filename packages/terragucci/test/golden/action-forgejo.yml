# Generated by terragucci.
# terragucci writes this file from terragucci.yml, or from its defaults when
# the repo has none. Change terragucci.yml and run `npx terragucci init`
# rather than editing it here.
# Every job runs in img:1; init pins its digest once the image is published.
name: terragucci action

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      root:
        description: The root the action is in, a path from the repository root
        required: true
        type: string
      address:
        description: The action's address, such as module.app.action.aws_lambda_invoke.rotate
        required: true
        type: string

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

jobs:
  action:
    runs-on: docker
    container:
      image: img:1
    if: (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/terragucci action ')) || github.event_name == 'workflow_dispatch'
    concurrency:
      group: terragucci-action-${{ github.repository }}
      cancel-in-progress: false
    env:
      TG_TOKEN: '${{ github.token }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: decide
        name: Read the comment or the dispatch and decide whether an action runs
        shell: bash
        run: |
          set -uo pipefail
          terragucci action --decide --layers 'apps/orders,apps/web' --forge forgejo --out terragucci-action.json || exit 1
          node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1],"utf-8")).go?0:1)' terragucci-action.json || exit 0
          echo "go=1" >>"$GITHUB_OUTPUT"
      - if: steps.decide.outputs.go == '1'
        name: Ask for the action, and run it once an approval by someone else stands
        shell: bash
        run: |
          set -uo pipefail
          terragucci action --from terragucci-action.json --forge forgejo
          code=$?
          [ "$code" -eq 3 ] && exit 0
          exit "$code"
