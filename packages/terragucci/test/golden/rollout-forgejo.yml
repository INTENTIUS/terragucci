# Generated by terragucci.
# terragucci writes this file from terragucci.yml, or from its defaults when
# the repo has none. Change terragucci.yml and run `npx terragucci init`
# rather than editing it here.
# Every job runs in img:1; init pins its digest once the image is published.
name: terragucci-rollout

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      module:
        description: The module or template to roll out, such as acme/bucket/aws; empty continues every rollout in flight
        required: false
        type: string
      version:
        description: The version to move to; empty for the newest published one
        required: false
        type: string

env:
  TF_IN_AUTOMATION: '1'
  TF_INPUT: '0'

concurrency:
  group: terragucci-rollout-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: docker
    container:
      image: img:1
    env:
      TG_TOKEN: '${{ github.token }}'
      TG_MODULE: '${{ github.event.inputs.module }}'
      TG_VERSION: '${{ github.event.inputs.version }}'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Start the dispatched rollout, or open the next wave of each rollout whose last wave merged and applied
        shell: bash
        run: |
          set -u
          export FORGEJO_TOKEN="$TG_TOKEN"
          if [ -n "${TG_MODULE:-}" ]; then
            set -- "$TG_MODULE"
            [ -z "${TG_VERSION:-}" ] || set -- "$@" "$TG_VERSION"
            code=0
            terragucci rollout "$@" --mode apply || code=$?
            [ "$code" -eq 3 ] || exit "$code"
          else
            terragucci respond rollout --mode apply
          fi
