# chant's pull-request pipeline for the fan-out estate, in the shape
# `chant build --components --generate forgejo --pr-loop --env demo --image
# terragucci-demo-chant-fanout:local` writes, with three steps the generator
# has no option for: each job builds and lints the fifteen templates (cfn-deploy
# applies dist/), seeds every deployed stack's outputs (cfn-deploy reads none
# while it plans, ci/stack-outputs.mjs), and keeps the stage's events in floci
# as it runs (ci/with-events.mjs).
name: chant-pr-demo

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CHANT_ENV: demo
  AWS_ENDPOINT_URL: http://floci:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  # Each stage's events, report and change set land at
  # <CHANT_EVENTS_URL>/<pull request>/<commit>/ (chant#4007's layout).
  CHANT_EVENTS_URL: 's3://demo-reports/demo/chant/${{ github.repository }}'
  # TODO(chant 0.124.29): set to --report-url "$CHANT_EVENTS_URL", and drop
  # ci/with-events.mjs; 0.124.28 has no --report-url.
  CHANT_REPORT_FLAGS: ''

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: docker
    container: terragucci-demo-chant-fanout:local
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and lint the fifteen templates
        run: ln -s /opt/demo-chant-fanout/node_modules node_modules && npm run build && npm run lint
      - name: Read the stacks' outputs
        run: node ci/stack-outputs.mjs .chant/seed-outputs.json
      - name: Plan the members this pull request reaches
        env:
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: node ci/with-events.mjs plan -- chant components pr-plan --base "$BASE_SHA" --pr "$PR_NUMBER" --env demo --gate pr-apply --output .chant/pr --forge forgejo --seed-outputs .chant/seed-outputs.json --events-json $CHANT_REPORT_FLAGS
      - name: Keep the plan report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: chant-pr-plan
          path: .chant/pr
          if-no-files-found: ignore
  apply:
    if: github.event_name == 'push'
    runs-on: docker
    container: terragucci-demo-chant-fanout:local
    concurrency:
      group: chant-apply-demo
      cancel-in-progress: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore the record of an earlier attempt at this commit
        uses: https://code.forgejo.org/actions/cache/restore@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-demo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: chant-apply-demo-${{ github.sha }}-
      - name: Build and lint the fifteen templates
        run: ln -s /opt/demo-chant-fanout/node_modules node_modules && npm run build && npm run lint
      - name: Read the stacks' outputs
        run: node ci/stack-outputs.mjs .chant/seed-outputs.json
      - name: Apply the plan a reviewer approved
        env:
          BASE_SHA: '${{ github.event.before }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: node ci/with-events.mjs apply -- chant components pr-apply --base "$BASE_SHA" --env demo --gate pr-apply --output .chant/pr --forge forgejo --require-review --resume .chant/pr-resume/pr-apply.json --seed-outputs .chant/seed-outputs.json --events-json $CHANT_REPORT_FLAGS
      - name: Keep the record for a re-run
        if: always()
        uses: https://code.forgejo.org/actions/cache/save@v4
        with:
          path: .chant/pr-resume/pr-apply.json
          key: chant-apply-demo-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the apply report
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: chant-pr-apply
          path: .chant/pr
          if-no-files-found: ignore
